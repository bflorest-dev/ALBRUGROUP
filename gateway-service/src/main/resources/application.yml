server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: lead-service-websocket
              uri: ${LEAD_SERVICE_WS_URI:ws://lead-service:8083}
              predicates:
                - Path=/leads/ws/**
              filters:
                - StripPrefix=1
            - id: schedule-service-websocket
              uri: ${SCHEDULE_SERVICE_WS_URI:ws://schedule-service:8085}
              predicates:
                - Path=/schedule/ws/**
              filters:
                - StripPrefix=1
            - id: recruitment-service-websocket
              uri: ${RECRUITMENT_SERVICE_WS_URI:ws://recruitment-service:8084}
              predicates:
                - Path=/recruitment/ws/**
              filters:
                - StripPrefix=1
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            - id: rrhh-service
              uri: ${RRHH_SERVICE_URI:http://rrhh-service:8082}
              predicates:
                - Path=/rrhh/**
              filters:
                - StripPrefix=1
            - id: lead-service
              uri: ${LEAD_SERVICE_URI:http://lead-service:8083}
              predicates:
                - Path=/leads/**
              filters:
                - StripPrefix=1
            - id: recruitment-service
              uri: ${RECRUITMENT_SERVICE_URI:http://recruitment-service:8084}
              predicates:
                - Path=/recruitment/**
              filters:
                - StripPrefix=1
            - id: schedule-service
              uri: ${SCHEDULE_SERVICE_URI:http://schedule-service:8085}
              predicates:
                - Path=/schedule/**
              filters:
                - StripPrefix=1
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

jwt:
  public-key-base64: ${JWT_PUBLIC_KEY_BASE64}
  issuer: ${JWT_ISSUER}

logging:
  level:
    org.springframework.security: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: gateway-service
        url: /v3/api-docs
      - name: auth-service
        url: /auth/v3/api-docs
      - name: rrhh-service
        url: /rrhh/v3/api-docs
      - name: lead-service
        url: /leads/v3/api-docs
      - name: recruitment-service
        url: /recruitment/v3/api-docs
      - name: schedule-service
        url: /schedule/v3/api-docs

presence:
  ttl: ${PRESENCE_TTL:90s}

services:
  auth:
    base-url: ${AUTH_SERVICE_URL:http://auth-service:8081}
  schedule:
    base-url: ${SCHEDULE_SERVICE_URL:http://schedule-service:8085}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:4201,http://127.0.0.1:4200,http://127.0.0.1:4201}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

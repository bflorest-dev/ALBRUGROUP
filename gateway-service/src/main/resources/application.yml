server:
  port: 8080
spring:
  application:
    name: gateway-service
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            - id: rrhh-service
              uri: http://localhost:8082
              predicates:
                - Path=/rrhh/**
              filters:
                - StripPrefix=1
            - id: lead-service
              uri: http://localhost:8083
              predicates:
                - Path=/leads/**
              filters:
                - StripPrefix=1
            - id: recruitment-service
              uri: http://localhost:8084
              predicates:
                - Path=/recruitment/**
              filters:
                - StripPrefix=1
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:5177"
                allowedMethods:
                  - GET
                  - POST
                  - PATCH
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
jwt:
  secret: 3bZ4bR0S5c7hFQ2nTzF8oQv9vKxM2yP7aLw8eJrHkU1cNdWqXyZp6tR9mVb4sL0Q8nF5gH2kJ3lP6rS9uVw==

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /auth/v3/api-docs
      - name: rrhh-service
        url: /rrhh/v3/api-docs
      - name: lead-service
        url: /leads/v3/api-docs
      - name: recruitment-service
        url: /recruitment/v3/api-docs

presence:
  ttl: 2m

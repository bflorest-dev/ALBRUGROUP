server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://auth-service:8081}
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            - id: rrhh-service
              uri: ${RRHH_SERVICE_URI:http://rrhh-service:8082}
              predicates:
                - Path=/rrhh/**
              filters:
                - StripPrefix=1
            - id: lead-service
              uri: ${LEAD_SERVICE_URI:http://lead-service:8083}
              predicates:
                - Path=/leads/**
              filters:
                - StripPrefix=1
            - id: recruitment-service
              uri: ${RECRUITMENT_SERVICE_URI:http://recruitment-service:8084}
              predicates:
                - Path=/recruitment/**
              filters:
                - StripPrefix=1
            - id: schedule-service
              uri: ${SCHEDULE_SERVICE_URI:http://schedule-service:8085}
              predicates:
                - Path=/schedule/**
              filters:
                - StripPrefix=1
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

jwt:
  secret: ${JWT_SECRET:3bZ4bR0S5c7hFQ2nTzF8oQv9vKxM2yP7aLw8eJrHkU1cNdWqXyZp6tR9mVb4sL0Q8nF5gH2kJ3lP6rS9uVw==}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: gateway-service
        url: /v3/api-docs
      - name: auth-service
        url: /auth/v3/api-docs
      - name: rrhh-service
        url: /rrhh/v3/api-docs
      - name: lead-service
        url: /leads/v3/api-docs
      - name: recruitment-service
        url: /recruitment/v3/api-docs
      - name: schedule-service
        url: /schedule/v3/api-docs

presence:
  ttl: ${PRESENCE_TTL:90s}

services:
  auth:
    base-url: ${AUTH_SERVICE_URL:http://auth-service:8081}
  schedule:
    base-url: ${SCHEDULE_SERVICE_URL:http://schedule-service:8085}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

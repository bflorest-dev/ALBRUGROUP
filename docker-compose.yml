services:
  postgres-core:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-core-data:/var/lib/postgresql/data
      - ./docker/postgres/core-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - albru-network

  postgres-lead:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-lead-data:/var/lib/postgresql/data
      - ./docker/postgres/lead-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - albru-network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - albru-network

  auth-service:
    build:
      context: ./auth-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
      AUTH_DB_URL: jdbc:postgresql://postgres-core:5432/auth_db
      AUTH_DB_USERNAME: postgres
      AUTH_DB_PASSWORD: postgres
      JWT_SECRET: 3bZ4bR0S5c7hFQ2nTzF8oQv9vKxM2yP7aLw8eJrHkU1cNdWqXyZp6tR9mVb4sL0Q8nF5gH2kJ3lP6rS9uVw==
      JWT_ISSUER: http://localhost:8080/auth
      AUTH_DOCS_GATEWAY_URL: http://localhost:8080/auth
      AUTH_DOCS_PUBLIC_URL: http://localhost:8080/auth
    depends_on:
      postgres-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health/readiness | grep '\"status\":\"UP\"' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - albru-network

  rrhh-service:
    build:
      context: ./rrhh-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
      RRHH_DB_URL: jdbc:postgresql://postgres-core:5432/rrhh_db
      RRHH_DB_USERNAME: postgres
      RRHH_DB_PASSWORD: postgres
      AUTH_SERVICE_URL: http://auth-service:8081
      RECRUITMENT_SERVICE_URL: http://recruitment-service:8084
      JWT_SECRET: 3bZ4bR0S5c7hFQ2nTzF8oQv9vKxM2yP7aLw8eJrHkU1cNdWqXyZp6tR9mVb4sL0Q8nF5gH2kJ3lP6rS9uVw==
      RRHH_DOCS_GATEWAY_URL: http://localhost:8080/rrhh
      RRHH_DOCS_PUBLIC_URL: http://localhost:8080/rrhh
    depends_on:
      postgres-core:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      recruitment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health/readiness | grep '\"status\":\"UP\"' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - albru-network

  lead-service:
    build:
      context: ./lead-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx512m
      LEAD_DB_URL: jdbc:postgresql://postgres-lead:5432/lead_db
      LEAD_DB_USERNAME: postgres
      LEAD_DB_PASSWORD: postgres
      LEAD_REDIS_HOST: redis
      LEAD_REDIS_PORT: 6379
      JWT_SECRET: 3bZ4bR0S5c7hFQ2nTzF8oQv9vKxM2yP7aLw8eJrHkU1cNdWqXyZp6tR9mVb4sL0Q8nF5gH2kJ3lP6rS9uVw==
      LEAD_DOCS_GATEWAY_URL: http://localhost:8080/leads
      LEAD_DOCS_PUBLIC_URL: http://localhost:8080/leads
    depends_on:
      postgres-lead:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8083/actuator/health/readiness | grep '\"status\":\"UP\"' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - albru-network

  recruitment-service:
    build:
      context: ./recruitment-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
      RECRUITMENT_DB_URL: jdbc:postgresql://postgres-core:5432/recruitment_db
      RECRUITMENT_DB_USERNAME: postgres
      RECRUITMENT_DB_PASSWORD: postgres
      RECRUITMENT_REDIS_HOST: redis
      RECRUITMENT_REDIS_PORT: 6379
      JWT_SECRET: 3bZ4bR0S5c7hFQ2nTzF8oQv9vKxM2yP7aLw8eJrHkU1cNdWqXyZp6tR9mVb4sL0Q8nF5gH2kJ3lP6rS9uVw==
      RECRUITMENT_DOCS_GATEWAY_URL: http://localhost:8080/recruitment
      RECRUITMENT_DOCS_PUBLIC_URL: http://localhost:8080/recruitment
    depends_on:
      postgres-core:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8084/actuator/health/readiness | grep '\"status\":\"UP\"' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - albru-network

  schedule-service:
    build:
      context: ./schedule-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
      SCHEDULE_DB_URL: jdbc:postgresql://postgres-core:5432/schedule_db
      SCHEDULE_DB_USERNAME: postgres
      SCHEDULE_DB_PASSWORD: postgres
      JWT_SECRET: 3bZ4bR0S5c7hFQ2nTzF8oQv9vKxM2yP7aLw8eJrHkU1cNdWqXyZp6tR9mVb4sL0Q8nF5gH2kJ3lP6rS9uVw==
      SCHEDULE_DOCS_GATEWAY_URL: http://localhost:8080/schedule
      SCHEDULE_DOCS_PUBLIC_URL: http://localhost:8080/schedule
    depends_on:
      postgres-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8085/actuator/health/readiness | grep '\"status\":\"UP\"' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - albru-network

  gateway-service:
    build:
      context: ./gateway-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m
      GATEWAY_REDIS_HOST: redis
      GATEWAY_REDIS_PORT: 6379
      AUTH_SERVICE_URI: http://auth-service:8081
      RRHH_SERVICE_URI: http://rrhh-service:8082
      LEAD_SERVICE_URI: http://lead-service:8083
      RECRUITMENT_SERVICE_URI: http://recruitment-service:8084
      SCHEDULE_SERVICE_URI: http://schedule-service:8085
      AUTH_SERVICE_URL: http://auth-service:8081
      SCHEDULE_SERVICE_URL: http://schedule-service:8085
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: 3bZ4bR0S5c7hFQ2nTzF8oQv9vKxM2yP7aLw8eJrHkU1cNdWqXyZp6tR9mVb4sL0Q8nF5gH2kJ3lP6rS9uVw==
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      rrhh-service:
        condition: service_healthy
      lead-service:
        condition: service_healthy
      recruitment-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness | grep '\"status\":\"UP\"' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks:
      - albru-network

  db-seeder:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: postgres
      PGUSER: postgres
      PGPORT: 5432
      PGHOST: postgres-core
      LEAD_PGHOST: postgres-lead
    depends_on:
      postgres-core:
        condition: service_healthy
      postgres-lead:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      rrhh-service:
        condition: service_healthy
      lead-service:
        condition: service_healthy
      recruitment-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
    volumes:
      - ./docker/postgres/seeds:/seeds:ro
      - ./lead-service/src/main/resources/ubigeo:/seed-data/ubigeo:ro
    command: ["sh", "/seeds/run-seeds.sh"]
    restart: "no"
    networks:
      - albru-network

  lead-migration:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: postgres
      PGUSER: postgres
      PGPORT: 5432
      PGHOST: postgres-lead
    depends_on:
      postgres-lead:
        condition: service_healthy
      lead-service:
        condition: service_healthy
      db-seeder:
        condition: service_completed_successfully
    volumes:
      - ./docker/postgres/seeds:/seeds:ro
      - ./docker/postgres/seeds/legacy:/seed-data/legacy:ro
    command: ["sh", "/seeds/run-lead-migration.sh"]
    restart: "no"
    networks:
      - albru-network

volumes:
  postgres-core-data:
  postgres-lead-data:

networks:
  albru-network:
    driver: bridge

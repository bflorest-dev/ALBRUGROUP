server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: rrhh-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

jwt:
  secret: ${JWT_SECRET:3bZ4bR0S5c7hFQ2nTzF8oQv9vKxM2yP7aLw8eJrHkU1cNdWqXyZp6tR9mVb4sL0Q8nF5gH2kJ3lP6rS9uVw==}

services:
  auth:
    base-url: ${AUTH_SERVICE_URL:http://auth-service:8081}
  recruitment:
    base-url: ${RECRUITMENT_SERVICE_URL:http://recruitment-service:8084}

app:
  docs:
    gateway-url: ${RRHH_DOCS_GATEWAY_URL:http://localhost:8080/rrhh}
    public-url: ${RRHH_DOCS_PUBLIC_URL:https://api.albrugroup.com/rrhh}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

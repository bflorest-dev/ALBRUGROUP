server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: call-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

jwt:
  public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}
  issuer: ${JWT_ISSUER:albrugroup}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  docs:
    gateway-url: ${CALL_DOCS_GATEWAY_URL:http://localhost:8080/calls}
    public-url: ${CALL_DOCS_PUBLIC_URL:https://api.albrugroup.com/calls}

  asterisk:
    ari:
      base-url: ${ASTERISK_ARI_BASE_URL:http://asterisk:8088}
      ws-url: ${ASTERISK_ARI_WS_URL:ws://asterisk:8088/ari/events}
      username: ${ASTERISK_ARI_USERNAME:callservice}
      password: ${ASTERISK_ARI_PASSWORD:callservice_secret}
      app-name: ${ASTERISK_ARI_APP_NAME:albrugroup-stasis}
      reconnect-initial-delay-ms: 2000
      reconnect-max-delay-ms: 30000
    ami:
      host: ${ASTERISK_AMI_HOST:asterisk}
      port: ${ASTERISK_AMI_PORT:5038}
      username: ${ASTERISK_AMI_USERNAME:callservice}
      password: ${ASTERISK_AMI_PASSWORD:callservice_secret}
      keep-alive-ms: 10000
    recording:
      local-spool-dir: ${ASTERISK_RECORDING_DIR:/var/spool/asterisk/recording}
      format: ${ASTERISK_RECORDING_FORMAT:wav}
      delete-after-upload: true

  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-recordings: ${MINIO_BUCKET_RECORDINGS:recordings}
    presigned-url-ttl-minutes: 60

  dialer:
    default-strategy: PROGRESSIVE
    default-ratio: 1.0
    poll-interval-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

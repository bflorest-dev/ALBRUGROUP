<div [class]="'layout-shell layout-shell--sidebar-v2 ' + themeClass()">
  <header class="mobile-topbar" [class.logout-guidance-active]="logoutGuidanceActive()">
    <button
      type="button"
      class="mobile-menu-button"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-label="Abrir menu"
      (click)="toggleMobileMenu()"
    >
      <i class="pi pi-bars" aria-hidden="true"></i>
    </button>
    <div class="mobile-topbar__brand">
      <strong>ALBRUGROUP</strong>
      <span>{{ primaryRoleLabel() }}</span>
    </div>
    <app-sidebar-attendance-picker
      #mobileAttendancePicker
      class="mobile-topbar__attendance"
      [statusLabel]="attendanceStatusLabel()"
      [statusColor]="attendanceStatusColor()"
      [actions]="attendanceActions()"
      [isLoading]="isAttendanceLoading()"
      [errorMessage]="attendancePickerErrorMessage()"
      [disabled]="isAttendancePickerDisabled()"
      [hint]="attendanceHint()"
      [tramos]="attendanceTramos()"
      [timerText]="attendanceTimerText()"
      [timerOver]="attendanceTimerOver()"
      [lunchWaitVisible]="isMobileViewport() && attendanceLunchWait()"
      [lunchDurationMinutes]="attendanceLunchDuration()"
      [placement]="'down'"
      [compact]="true"
      [guidedActionId]="isMobileViewport() && logoutGuidanceActive() ? 'REGISTRAR_SALIDA' : null"
      (actionSelected)="submitAttendanceAction($event)"
      (retry)="attendanceFacade.reload()"
      (guidanceCancelled)="cancelLogoutGuidance()"
    />
  </header>

  @if (mobileMenuOpen()) {
    <button type="button" class="mobile-menu-backdrop" aria-label="Cerrar menu" (click)="closeMobileMenu()"></button>
  }

  @if (logoutGuidanceActive()) {
    <button
      type="button"
      class="logout-guidance-backdrop"
      aria-label="Cancelar y seguir trabajando"
      [disabled]="isAttendanceLoading()"
      (click)="cancelLogoutGuidance()"
    ></button>
  }

  <app-admin-sidebar-v2
      class="sidebar-v2-host"
      [class.sidebar-v2-host--mobile-open]="mobileMenuOpen()"
      [class.logout-guidance-active]="logoutGuidanceActive()"
      [items]="menuItems()"
      [domainDefinitions]="sidebarDomainDefinitions()"
      [displayName]="userDisplayName()"
      [roleLabel]="primaryRoleLabel()"
      [statusLabel]="attendanceStatusLabel()"
      [statusColor]="attendanceStatusColor()"
      [attendanceActions]="attendanceActions()"
      [attendanceLoading]="isAttendanceLoading()"
      [attendanceErrorMessage]="attendancePickerErrorMessage()"
      [attendanceDisabled]="isAttendancePickerDisabled()"
      [attendanceHint]="attendanceHint()"
      [attendanceTramos]="attendanceTramos()"
      [attendanceTimerText]="attendanceTimerText()"
      [attendanceTimerOver]="attendanceTimerOver()"
      [attendanceLunchWaitVisible]="!isMobileViewport() && attendanceLunchWait()"
      [attendanceLunchDuration]="attendanceLunchDuration()"
      [attendanceGuided]="!isMobileViewport() && logoutGuidanceActive()"
      [deleteLeadsVisible]="adminDeleteLeadsVisible()"
      [showDeleteLeadsAction]="isAdmin()"
      [canCorrectMerito]="canCorrectMerito()"
      [providers]="mostrarSelectorProveedor() ? proveedoresUsuario() : []"
      [activeProviderId]="proveedorActivoId()"
      [roleModes]="roleModes()"
      [activeRole]="activeRole()"
      [overlayMode]="isMobileViewport()"
      (deleteLeadsToggled)="toggleAdminDeleteLeadsVisible()"
      (correctMeritoRequested)="openMeritoCorrection()"
      (providerSelected)="seleccionarProveedor($event)"
      (roleModeSelected)="seleccionarModoTrabajo($event)"
      (attendanceActionSelected)="submitAttendanceAction($event)"
      (attendanceRetry)="attendanceFacade.reload()"
      (attendanceGuidanceCancelled)="cancelLogoutGuidance()"
      (navigationDismissed)="closeMobileMenu()"
      (logoutRequested)="logout()"
  />

  <main class="content">
    <app-top-banner />

    <router-outlet />
  </main>

  <app-lead-merito-correccion-drawer />
</div>

<div class="layout-shell">
  <aside class="sidebar">
    <div class="sidebar__top">
      <div class="brand">
        <span class="brand__eyebrow">ALBRUGROUP</span>
        <h1 class="brand__title">Frontend Base</h1>
      </div>

      <nav class="menu">
        <a
          [routerLink]="session?.homeRoute ?? '/app'"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Inicio
        </a>
      </nav>
    </div>

    <div class="sidebar__bottom">
      <button type="button" class="logout-button" (click)="logout()" aria-label="Cerrar sesion">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M10 3h4a3 3 0 0 1 3 3v2h-2V6a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-2h2v2a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Zm6.59 4.59L21 12l-4.41 4.41-1.41-1.41L17.17 13H11v-2h6.17l-1.99-1.99 1.41-1.42Z"
          />
        </svg>
      </button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>

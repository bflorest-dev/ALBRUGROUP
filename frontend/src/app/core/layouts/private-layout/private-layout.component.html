<div [class]="'layout-shell ' + themeClass()">
  <aside class="sidebar" aria-label="Menu principal">
    <div class="sidebar__brand">
      <span class="brand__logo" aria-hidden="true">
        <i class="pi pi-building"></i>
      </span>
      <span class="brand__copy">
        <span class="brand__eyebrow">ALBRUGROUP</span>
        <strong class="brand__title">Panel operativo</strong>
      </span>
    </div>

    <nav class="menu" aria-label="Navegacion del rol">
      <span class="menu__section">Workspace</span>

      @for (item of menuItems(); track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          class="menu__item"
        >
          <span class="menu__item-main">
            <i [class]="item.icon" aria-hidden="true"></i>
            <span>{{ item.label }}</span>
          </span>

          @if (item.badge) {
            <p-badge [value]="item.badge" severity="danger" />
          }
        </a>
      }
    </nav>

    <div class="sidebar__bottom">
      @if (profileMenuOpen()) {
        <div class="profile-menu">
          <button type="button" class="profile-menu__item" (click)="logout()">
            <i class="pi pi-sign-out" aria-hidden="true"></i>
            <span>Cerrar sesion</span>
          </button>
        </div>
      }

      <button
        type="button"
        class="profile-button"
        [attr.aria-expanded]="profileMenuOpen()"
        (click)="toggleProfileMenu()"
      >
        <span class="profile-button__avatar" aria-hidden="true">
          <i class="pi pi-user"></i>
        </span>
        <span class="profile-button__copy">
          <strong>{{ userDisplayName() }}</strong>
          <small>{{ primaryRoleLabel() }}</small>
        </span>
        <i [class]="profileMenuOpen() ? 'pi pi-angle-down' : 'pi pi-angle-up'" aria-hidden="true"></i>
      </button>
    </div>
  </aside>

  <main class="content">
    <app-top-banner>
      <div banner-main class="development-banner-copy">
        <i class="pi pi-info-circle" aria-hidden="true"></i>
        <span>Web en Desarrollo, para cualquier inconveniente comunicate con el area de Desarrollo.</span>
      </div>

      <app-attendance-status-picker
        banner-actions
        [statusLabel]="attendanceStatusLabel()"
        [statusColor]="attendanceStatusColor()"
        [actions]="attendanceActions()"
        [isLoading]="isAttendanceLoading()"
        [errorMessage]="attendancePickerErrorMessage()"
        [disabled]="isAttendancePickerDisabled()"
        [hint]="attendanceHint()"
        (actionSelected)="submitAttendanceAction($event)"
        (retry)="attendanceFacade.reload()"
      />
    </app-top-banner>

    <router-outlet />
  </main>
</div>

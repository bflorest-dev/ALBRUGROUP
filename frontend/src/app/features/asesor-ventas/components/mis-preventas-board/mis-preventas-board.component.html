<p-card styleClass="mis-preventas-board">
  <ng-template #title>
    <span class="board-title">
      Preventas que cerraste
      <p-tag severity="info" [value]="facade.totalElements().toString()" />
    </span>
  </ng-template>
  <ng-template #subtitle>Seguimiento de tus leads que pasaron a venta</ng-template>

  <div class="board-filters">
    <p-selectButton
      [options]="facade.periodOptions"
      optionLabel="label"
      optionValue="value"
      [allowEmpty]="false"
      [ngModel]="facade.period()"
      [ngModelOptions]="{ standalone: true }"
      (onChange)="facade.setPeriod($event.value)"
    />
    <p-datepicker
      view="month"
      dateFormat="MM yy"
      [ngModel]="facade.selectedMonth()"
      [ngModelOptions]="{ standalone: true }"
      [maxDate]="facade.maxMonth"
      [readonlyInput]="true"
      [showIcon]="true"
      iconDisplay="input"
      appendTo="body"
      placeholder="Elegir mes"
      (onSelect)="facade.setMonth($event)"
    />
  </div>

  <p-table
    [value]="facade.rows()"
    dataKey="id"
    [loading]="facade.isLoading()"
    [rowHover]="true"
    [scrollable]="true"
    scrollHeight="flex"
    [tableStyle]="{ 'min-width': '860px' }"
    styleClass="p-datatable-sm"
  >
    <ng-template #header>
      <tr>
        <th>Lead</th>
        <th>Etapa actual</th>
        <th>Tipificación</th>
        <th>Última actualización</th>
        <th class="col-actions">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-row>
      <tr>
        <td>
          <strong>{{ facade.leadPhone(row) }}</strong>
        </td>
        <td>
          <p-tag [severity]="facade.etapaSeverity(row.etapa)" [value]="facade.etapaLabel(row.etapa)" />
        </td>
        <td>
          <app-tipification-stack
            [codigoTipificacion]="row.codigoTipificacion"
            [codigoSubtipificacion]="row.codigoSubtipificacion"
          />
        </td>
        <td>{{ row.updatedAt | date: 'dd/MM/yyyy hh:mm a' }}</td>
        <td>
          <button
            pButton
            type="button"
            icon="pi pi-eye"
            label="Ver"
            size="small"
            severity="secondary"
            (click)="facade.openDetail(row)"
          ></button>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="5">
          <span class="helper--centered">Todavía no has cerrado ninguna preventa.</span>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-paginator
    [first]="facade.pageNumber() * facade.pageSize"
    [rows]="facade.pageSize"
    [totalRecords]="facade.totalElements()"
    (onPageChange)="facade.changePage($event.page ?? 0)"
  />
</p-card>

<form [formGroup]="horarioForm" class="schedule-editor">
  <div class="schedule-editor__row">
    <label class="field">
      <span>Compensable</span>
      <p-togglebutton
        [ngModel]="isCompensable()"
        [ngModelOptions]="{ standalone: true }"
        onLabel="SI"
        offLabel="NO"
        onIcon="pi pi-check"
        offIcon="pi pi-times"
        (onChange)="setCompensable($event.checked)"
      />
    </label>

    <div class="schedule-editor__mode">
      <button
        pButton
        type="button"
        severity="secondary"
        [outlined]="true"
        icon="pi pi-cog"
        [label]="isAdvanced() ? 'Usar horario simple' : 'Configuracion avanzada'"
        (click)="toggleAdvanced()"
      ></button>
    </div>
  </div>

  @if (!isAdvanced()) {
    <div class="schedule-editor__simple">
      <div class="schedule-editor__times">
        <label class="field field--time">
          <span>Entrada</span>
          <p-datepicker
            formControlName="horaEntrada"
            dataType="string"
            [timeOnly]="true"
            hourFormat="24"
            [stepMinute]="15"
            [showIcon]="true"
            icon="pi pi-clock"
            appendTo="body"
            (onSelect)="onSimpleTimeChange()"
            (onInput)="onSimpleTimeChange()"
          />
        </label>

        <label class="field field--time">
          <span>Salida</span>
          <p-datepicker
            formControlName="horaSalida"
            dataType="string"
            [timeOnly]="true"
            hourFormat="24"
            [stepMinute]="15"
            [showIcon]="true"
            icon="pi pi-clock"
            appendTo="body"
            (onSelect)="onSimpleTimeChange()"
            (onInput)="onSimpleTimeChange()"
          />
        </label>

        @if (usesLunchBreakSig()) {
          <label class="field field--time">
            <span>Inicio almuerzo</span>
            <p-datepicker
              formControlName="inicioAlmuerzo"
              dataType="string"
              [timeOnly]="true"
              hourFormat="24"
              [stepMinute]="15"
              [showIcon]="true"
              icon="pi pi-clock"
              appendTo="body"
              (onSelect)="onSimpleTimeChange()"
              (onInput)="onSimpleTimeChange()"
            />
          </label>

          <label class="field field--time">
            <span>Fin almuerzo</span>
            <p-datepicker
              formControlName="finAlmuerzo"
              dataType="string"
              [timeOnly]="true"
              hourFormat="24"
              [stepMinute]="15"
              [showIcon]="true"
              icon="pi pi-clock"
              appendTo="body"
              (onSelect)="onSimpleTimeChange()"
              (onInput)="onSimpleTimeChange()"
            />
          </label>
        }
      </div>

      <div class="schedule-editor__rest">
        <span class="schedule-editor__rest-label">Dia de descanso</span>
        <div class="day-strip">
          @for (day of diasSemanaOptions; track day) {
            <button
              type="button"
              class="day-toggle"
              [class.day-toggle--rest]="isRestDay(day)"
              (click)="selectRestDay(day)"
            >
              <p-tag
                [value]="dayShort(day)"
                [severity]="isRestDay(day) ? 'secondary' : 'success'"
              />
            </button>
          }
        </div>
      </div>
    </div>
  } @else {
    <div class="schedule-editor__advanced" formArrayName="detalles">
      @for (detalle of detallesArray.controls; track $index) {
        <section class="schedule-day-card" [formGroupName]="$index">
          <header class="schedule-day-card__header">
            <strong>{{ dayLabel(diasSemanaOptions[$index]) }}</strong>
            <label class="field schedule-day-card__toggle">
              <span>Laborable</span>
              <p-select
                formControlName="laborable"
                [options]="yesNoOptions"
                optionLabel="label"
                optionValue="value"
                appendTo="body"
              />
            </label>
          </header>

          <div class="schedule-day-card__body">
            <label class="field field--time">
              <span>Entrada</span>
              <p-datepicker
                formControlName="horaEntrada"
                dataType="string"
                [timeOnly]="true"
                hourFormat="24"
                [stepMinute]="15"
                [showIcon]="true"
                icon="pi pi-clock"
                appendTo="body"
              />
            </label>
            <label class="field field--time">
              <span>Salida</span>
              <p-datepicker
                formControlName="horaSalida"
                dataType="string"
                [timeOnly]="true"
                hourFormat="24"
                [stepMinute]="15"
                [showIcon]="true"
                icon="pi pi-clock"
                appendTo="body"
              />
            </label>
            @if (usesLunchBreakSig()) {
              <label class="field field--time">
                <span>Inicio almuerzo</span>
                <p-datepicker
                  formControlName="inicioAlmuerzo"
                  dataType="string"
                  [timeOnly]="true"
                  hourFormat="24"
                  [stepMinute]="15"
                  [showIcon]="true"
                  icon="pi pi-clock"
                  appendTo="body"
                />
              </label>
              <label class="field field--time">
                <span>Fin almuerzo</span>
                <p-datepicker
                  formControlName="finAlmuerzo"
                  dataType="string"
                  [timeOnly]="true"
                  hourFormat="24"
                  [stepMinute]="15"
                  [showIcon]="true"
                  icon="pi pi-clock"
                  appendTo="body"
                />
              </label>
            }
          </div>
        </section>
      }
    </div>
  }
</form>

<div class="events-panel">
  @if (selectedEmployee) {
    <div class="events-header">
      <div>
        <h3>{{ selectedEmployee.nombres }} {{ selectedEmployee.apellidos }}</h3>
        <p>{{ selectedEmployee.tipoDocumento }} {{ selectedEmployee.numeroDocumento }}</p>
      </div>
      <button pButton type="button" severity="secondary" icon="pi pi-refresh" (click)="reload.emit()"></button>
    </div>
  }

  @if (errorMessage) {
    <p-message severity="error" [text]="errorMessage" />
  }

  <p-table [value]="events" [loading]="isLoading" styleClass="p-datatable-sm">
    <ng-template #header>
      <tr>
        <th>Evento</th>
        <th>Fecha</th>
      </tr>
    </ng-template>
    <ng-template #body let-event>
      <tr>
        <td><p-tag severity="info" [value]="toLabel(event.evento)" /></td>
        <td>{{ toDate(event.fechaEvento || event.createdAt) }}</td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr><td colspan="2">No hay eventos para este empleado.</td></tr>
    </ng-template>
  </p-table>

  <p-paginator
    [first]="currentPage * 8"
    [rows]="8"
    [totalRecords]="totalPages * 8"
    (onPageChange)="pageChange.emit($event.page ?? 0)"
  />
</div>

<p-card styleClass="rrhh-panel-card">
  <ng-template #title>{{ isEditing ? 'Editar postulante' : 'Registrar postulante' }}</ng-template>
  <ng-template #subtitle>Origen, oferta y datos basicos para crear la postulacion.</ng-template>

  @if (activeOffersErrorMessage) {
    <p-message severity="error" [text]="activeOffersErrorMessage" />
  }
  @if (saveErrorMessage) {
    <p-message severity="error" [text]="saveErrorMessage" />
  }
  @if (saveSuccessMessage) {
    <p-message severity="success" [text]="saveSuccessMessage" />
  }

  <form class="form-grid" [formGroup]="postulanteForm" (ngSubmit)="save.emit()">
    <label>
      <span>Oferta laboral</span>
      <p-select
        formControlName="idOfertaLaboral"
        [options]="activeOffers"
        optionLabel="titulo"
        optionValue="id"
        placeholder="Selecciona oferta"
        [loading]="isLoadingActiveOffers"
        appendTo="body"
      />
    </label>

    <label>
      <span>Origen</span>
      <p-select formControlName="origen" [options]="origenOptions" placeholder="Origen" appendTo="body" />
    </label>

    <label>
      <span>Nombres</span>
      <input pInputText formControlName="nombres" />
    </label>

    <label>
      <span>Apellidos</span>
      <input pInputText formControlName="apellidos" />
    </label>

    <label>
      <span>Tipo documento</span>
      <p-select formControlName="tipoDocumento" [options]="documentoOptions" appendTo="body" />
    </label>

    <label>
      <span>Documento</span>
      <input pInputText formControlName="documento" />
    </label>

    <label>
      <span>Celular</span>
      <input pInputText formControlName="celular" />
    </label>

    <label>
      <span>Fecha nacimiento</span>
      <input pInputText type="date" formControlName="fechaNacimiento" />
    </label>

    <div class="form-actions">
      @if (isEditing) {
        <button pButton type="button" label="Cancelar" severity="secondary" (click)="cancelEdit.emit()"></button>
      }
      <button
        pButton
        type="submit"
        [label]="isEditing ? 'Guardar cambios' : 'Registrar'"
        icon="pi pi-save"
        [loading]="isSaving"
      ></button>
    </div>
  </form>
</p-card>

<section class="panel">
  <div class="panel__header">
    <div>
      <span class="panel__eyebrow">Registro</span>
      <h3>{{ isEditing ? 'Editar postulante' : 'Registrar postulante' }}</h3>
    </div>
  </div>

  @if (activeOffersErrorMessage) {
    <p class="form-message form-message--error">{{ activeOffersErrorMessage }}</p>
  }

  <form [formGroup]="postulanteForm" class="form-grid">
    <label class="field--wide">
      <span>Oferta laboral activa</span>
      <select formControlName="idOfertaLaboral">
        <option [value]="0">
          {{ isLoadingActiveOffers ? 'Cargando ofertas...' : 'Seleccionar oferta' }}
        </option>
        @for (offer of activeOffers; track offer.id) {
          <option [value]="offer.id">
            {{ offer.codigo }} - {{ toLabel(offer.negocio) }} / {{ toLabel(offer.puestoObjetivo) }}
          </option>
        }
      </select>
    </label>

    <label>
      <span>Origen</span>
      <select formControlName="origen">
        @for (option of origenOptions; track option) {
          <option [value]="option">{{ toLabel(option) }}</option>
        }
      </select>
    </label>

    <label>
      <span>Tipo documento</span>
      <select formControlName="tipoDocumento">
        @for (option of documentoOptions; track option) {
          <option [value]="option">{{ option }}</option>
        }
      </select>
    </label>

    <label>
      <span>Documento</span>
      <input type="text" formControlName="documento" />
    </label>

    <label>
      <span>Celular</span>
      <input type="text" formControlName="celular" />
    </label>

    <label>
      <span>Nombres</span>
      <input type="text" formControlName="nombres" />
    </label>

    <label>
      <span>Apellidos</span>
      <input type="text" formControlName="apellidos" />
    </label>

    <label>
      <span>Fecha nacimiento</span>
      <input type="date" formControlName="fechaNacimiento" />
    </label>
  </form>

  @if (saveErrorMessage) {
    <p class="form-message form-message--error">{{ saveErrorMessage }}</p>
  }

  @if (saveSuccessMessage) {
    <p class="form-message form-message--success">{{ saveSuccessMessage }}</p>
  }

  <div class="actions">
    @if (isEditing) {
      <button type="button" class="secondary-button" (click)="cancelEdit.emit()">Cancelar edicion</button>
    }
    <button type="button" class="primary-button" [disabled]="isSaving" (click)="save.emit()">
      {{ isSaving ? 'Guardando...' : isEditing ? 'Actualizar postulante' : 'Registrar postulante' }}
    </button>
  </div>
</section>

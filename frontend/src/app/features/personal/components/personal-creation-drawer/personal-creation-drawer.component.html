@if (visible()) {
  <button class="creation-scrim" type="button" aria-label="Cerrar alta de personal" (click)="close()"></button>
  <aside class="creation-drawer" role="dialog" aria-modal="true" aria-label="Crear empleado" [attr.data-theme]="theme()">
    <header>
      <div>
        <h2>Nuevo empleado</h2>
        <p>Registra la identidad y completa el resto del expediente después.</p>
      </div>
      <button class="close-button" type="button" aria-label="Cerrar" (click)="close()">
        <i class="ti ti-x" aria-hidden="true"></i>
      </button>
    </header>

    <div class="creation-body">
      <app-personal-employee-identity-form
        [empleadoForm]="facade.empleadoForm"
        [isSubmitting]="facade.isSubmittingIdentity()"
        [errorMessage]="facade.submitErrorMessage()"
        [result]="facade.identityCreationResult()"
        [empresasContratistas]="facade.empresasContratistas()"
        [documentoOptions]="facade.documentoOptions"
        [nacionalidadOptions]="facade.nacionalidadOptions"
        [estadoCivilOptions]="facade.estadoCivilOptions"
        [origenOptions]="facade.origenOptions"
        [distritoOptions]="facade.distritoOptions"
        [bancoOptions]="facade.bancoOptions"
        [parentescoOptions]="facade.parentescoOptions"
        (submitted)="facade.submitIdentityOnly()"
        (closed)="close()"
      />
    </div>
  </aside>
}

<section class="admin-page">
  <header class="hero">
    <p-tag value="Administrador" severity="info" />
    <h2>Finanzas de campanas</h2>
    <p>Vista consolidada de lectura para revisar el estado diario y mensual de cada campana.</p>
  </header>

  @if (facade.errorMessage()) {
    <p-message severity="error" [text]="facade.errorMessage() ?? ''" />
  }

  @if (facade.successMessage()) {
    <p-message severity="success" [text]="facade.successMessage() ?? ''" />
  }

  <app-campaign-finance-dashboard-panel
    panelTitle="Finanzas de campanas"
    [subtitle]="facade.isPeriodActive() ? facade.dailySummaryTitle() : facade.financeDate()"
    [enablePeriodFilter]="true"
    [showTeamSelector]="true"
    [periodStart]="facade.periodStart()"
    [periodEnd]="facade.periodEnd()"
    [hasPeriodSelection]="facade.hasPeriodSelection()"
    [periodWarning]="facade.periodWarning()"
    [dailySummaryTitle]="facade.dailySummaryTitle()"
    [dailyTableTitle]="facade.dailyTableTitle()"
    [snapshotSubtitle]="facade.snapshotSubtitle()"
    [teamOptions]="facade.teamOptions()"
    [selectedTeamId]="facade.selectedTeamId()"
    [isLoading]="facade.isLoadingFinance()"
    [isLoadingSnapshots]="facade.isLoadingFinanceSnapshots()"
    [dailyCards]="facade.dailyFinanceCards()"
    [monthlyCards]="facade.monthlyFinanceCards()"
    [dailyRows]="facade.dailyFinanceRows()"
    [snapshotRows]="facade.snapshotRows()"
    [selectedCampaign]="facade.selectedExpenseCampaign()"
    [snapshotsVisible]="facade.expenseSnapshotsOpen()"
    [allowExpenseRegistration]="true"
    [expenseDialogVisible]="facade.expenseDialogOpen()"
    [expenseForm]="facade.expenseForm"
    [expenseErrorMessage]="facade.errorMessage()"
    [expenseRegistrationWarning]="facade.expenseRegistrationWarning()"
    [expenseRegistrationCheckError]="facade.expenseRegistrationCheckError()"
    [campaignOptions]="facade.campanasActivas()"
    [isSavingExpense]="facade.isSavingExpense()"
    (periodStartChanged)="facade.onPeriodStartChanged($event)"
    (periodEndChanged)="facade.onPeriodEndChanged($event)"
    (clearPeriod)="facade.clearPeriod()"
    (teamChanged)="facade.onTeamChanged($event)"
    (openExpenseDialog)="facade.openExpenseDialog()"
    (closeExpenseDialog)="facade.closeExpenseDialog()"
    (submitExpense)="facade.submitExpense()"
    (expenseCampaignChanged)="facade.onExpenseCampaignChanged($event)"
    (openSnapshots)="facade.openExpenseSnapshots($event)"
    (closeSnapshots)="facade.closeExpenseSnapshots()"
  />
</section>

<section class="admin-page">
  <header class="hero">
    <p-tag value="Administrador" severity="info" />
    @if (mode === 'inicio') {
      <h2>Empleados activos</h2>
      <p>Personal con contrato vigente agrupado por rol operativo.</p>
    } @else {
      <h2>Alta de personal</h2>
      <p>Flujo directo `empleado -> contrato -> usuario auth`.</p>
    }
  </header>

  @if (mode === 'inicio') {
    <app-employee-access-panel
      [employees]="[]"
      [activeGroups]="facade.activeEmployeeGroups()"
      [currentPage]="0"
      [totalPages]="1"
      [isLoading]="facade.isLoadingActiveEmployees()"
      [errorMessage]="facade.activeEmployeeListErrorMessage()"
      [contractUpdateSuccessMessage]="facade.contractRenewalSuccessMessage()"
      [accessByEmployeeId]="facade.accessByEmployeeId()"
      [accessErrorByEmployeeId]="facade.accessErrorByEmployeeId()"
      [accessLoadingByEmployeeId]="facade.accessLoadingByEmployeeId()"
      (reload)="facade.loadActiveEmployees()"
      (pageChange)="facade.loadActiveEmployees()"
      (toggleAccess)="facade.toggleUserAccess($event)"
      (renewContract)="facade.openContractRenewal($event)"
    />

    <app-contract-renewal-dialog
      [visible]="facade.isContractRenewalVisible()"
      [employee]="facade.selectedEmployeeForContractRenewal()"
      [contractForm]="facade.contractRenewalForm"
      [puestoTrabajoOptions]="facade.puestoTrabajoOptions"
      [regimenOptions]="facade.regimenOptions"
      [modalidadOptions]="facade.modalidadOptions"
      [seguroSaludOptions]="facade.seguroSaludOptions"
      [sistemaPensionesOptions]="facade.sistemaPensionesOptions"
      [isLoadingCurrentContract]="facade.isLoadingContractRenewal()"
      [isSubmitting]="facade.isSubmittingContractRenewal()"
      [errorMessage]="facade.contractRenewalErrorMessage()"
      [successMessage]="facade.contractRenewalSuccessMessage()"
      (visibleChange)="!$event && facade.closeContractRenewal()"
      (submit)="facade.submitContractRenewal()"
    />
  } @else {
  <div class="admin-grid admin-grid--single">
    <app-personal-registration-panel
      [empleadoForm]="facade.empleadoForm"
      [contratoForm]="facade.contratoForm"
      [horarioForm]="facade.horarioForm"
      [currentStep]="facade.currentStep()"
      [isSubmitting]="facade.isSubmitting()"
      [submitErrorMessage]="facade.submitErrorMessage()"
      [creationResult]="facade.creationResult()"
      [isPersonalReviewVisible]="facade.isPersonalReviewVisible()"
      [personalReviewSummary]="facade.personalReviewSummary()"
      [empresasContratistas]="facade.empresasContratistas()"
      [documentoOptions]="facade.documentoOptions"
      [nacionalidadOptions]="facade.nacionalidadOptions"
      [estadoCivilOptions]="facade.estadoCivilOptions"
      [origenOptions]="facade.origenOptions"
      [distritoOptions]="facade.distritoOptions"
      [bancoOptions]="facade.bancoOptions"
      [parentescoOptions]="facade.parentescoOptions"
      [puestoTrabajoOptions]="facade.puestoTrabajoOptions"
      [regimenOptions]="facade.regimenOptions"
      [modalidadOptions]="facade.modalidadOptions"
      [seguroSaludOptions]="facade.seguroSaludOptions"
      [sistemaPensionesOptions]="facade.sistemaPensionesOptions"
      [diasSemanaOptions]="facade.diasSemanaOptions"
      (continueToContract)="facade.continueToContract()"
      (continueToSchedule)="facade.continueToSchedule()"
      (backToEmployee)="facade.backToEmployee()"
      (backToContract)="facade.backToContract()"
      (submitPersonalFlow)="facade.submitPersonalFlow()"
      (requestPersonalReview)="facade.requestPersonalReview()"
      (cancelPersonalReview)="facade.cancelPersonalReview()"
      (confirmPersonalReview)="facade.confirmPersonalReview()"
      (resetFlow)="facade.resetFlow()"
    />

  </div>
  }
</section>

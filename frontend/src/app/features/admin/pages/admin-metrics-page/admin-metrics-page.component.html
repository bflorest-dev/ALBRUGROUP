<section class="admin-page">
  <header class="hero">
    <p-tag value="Administrador" severity="info" />
    <h2>Dashboard</h2>
    <p>Métricas del día de "Leads del día", desglosadas por equipo.</p>
  </header>

  <p-card>
    <div class="metrics-toolbar">
      <app-date-field
        label="Fecha"
        inputId="dashboard-fecha"
        [max]="maxDate"
        [ngModel]="fecha()"
        (ngModelChange)="onFechaChange($event)"
      />
      <label class="metrics-filter">
        <span>Equipo</span>
        <p-select
          inputId="dashboard-equipo"
          [options]="equipoOptions()"
          [ngModel]="selectedEquipoId()"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          (ngModelChange)="onEquipoChange($event)"
        />
      </label>
      <button
        pButton
        type="button"
        icon="pi pi-refresh"
        label="Actualizar"
        severity="secondary"
        [outlined]="true"
        [loading]="isLoading()"
        (click)="load()"
      ></button>
    </div>

    @if (errorMessage()) {
      <p-message severity="error" [text]="errorMessage()" styleClass="metrics-message" />
    }

    @if (gaugeCards().length) {
      <app-team-metric-gauges [cards]="gaugeCards()" />
    } @else {
      <div class="metrics-empty">
        @if (isLoading()) {
          Cargando métricas...
        } @else {
          No hubo registros en esta fecha.
        }
      </div>
    }
  </p-card>

  <p-card styleClass="metrics-gxc-card">
    <app-gestion-campana-panel [selectedEquipoId]="selectedEquipoId()" />
  </p-card>
</section>

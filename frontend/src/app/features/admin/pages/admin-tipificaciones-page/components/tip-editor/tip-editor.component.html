<div class="grid gap-5 p-4 sm:p-5">
  <div class="grid items-end gap-3 lg:grid-cols-[minmax(12rem,0.8fr)_minmax(18rem,1.5fr)_auto]">
    <label class="grid min-w-0 gap-1.5">
      <span class="text-xs font-bold text-slate-600">Código</span>
      <input
        pInputText
        type="text"
        class="w-full"
        [ngModel]="tip.codigo"
        (ngModelChange)="updateTip('codigo', $event)"
      />
    </label>

    <label class="grid min-w-0 gap-1.5">
      <span class="text-xs font-bold text-slate-600">Descripción</span>
      <input
        pInputText
        type="text"
        class="w-full"
        [ngModel]="tip.descripcion"
        (ngModelChange)="updateTip('descripcion', $event)"
      />
    </label>

    <button
      pButton
      type="button"
      icon="pi pi-trash"
      label="Quitar"
      severity="danger"
      [text]="true"
      (click)="removeTip.emit(tip.uid)"
    ></button>
  </div>

  <div class="grid gap-3 border-t border-dashed border-slate-200 pt-4">
    @for (sub of tip.subtipificaciones; track sub.uid; let index = $index) {
      <div
        class="subtip-row grid min-w-0 gap-3 rounded-md border border-slate-200 bg-slate-50 p-3 xl:grid-cols-[auto_minmax(8rem,0.7fr)_minmax(11rem,1.2fr)_minmax(9rem,0.8fr)_minmax(9rem,0.8fr)_minmax(9rem,0.8fr)_auto] xl:items-end"
        (dragover)="allowDrop($event)"
        (drop)="dropAt(index, $event)"
      >
        <div class="flex h-10 items-center gap-1">
          <button
            type="button"
            class="subtip-grip grid size-9 cursor-grab place-items-center rounded-md border-0 bg-transparent p-0 text-slate-400 hover:bg-slate-200 hover:text-slate-700"
            draggable="true"
            pTooltip="Mover subtipificación"
            tooltipPosition="top"
            (dragstart)="startSubtipDrag(sub.uid, $event)"
          >
            <i class="pi pi-bars"></i>
          </button>
          <div class="flex xl:hidden">
            <button
              pButton
              type="button"
              icon="pi pi-chevron-up"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              size="small"
              pTooltip="Subir"
              [disabled]="index === 0"
              (click)="moveSubtip.emit({ tipUid: tip.uid, subUid: sub.uid, direction: -1 })"
            ></button>
            <button
              pButton
              type="button"
              icon="pi pi-chevron-down"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              size="small"
              pTooltip="Bajar"
              [disabled]="index === tip.subtipificaciones.length - 1"
              (click)="moveSubtip.emit({ tipUid: tip.uid, subUid: sub.uid, direction: 1 })"
            ></button>
          </div>
        </div>

        <label class="grid min-w-0 gap-1.5">
          <span class="text-xs font-bold text-slate-600">Código</span>
          <input
            pInputText
            type="text"
            class="w-full"
            [ngModel]="sub.codigo"
            (ngModelChange)="updateSubtip(sub, 'codigo', $event)"
          />
        </label>

        <label class="grid min-w-0 gap-1.5">
          <span class="text-xs font-bold text-slate-600">Descripción</span>
          <input
            pInputText
            type="text"
            class="w-full"
            [ngModel]="sub.descripcion"
            (ngModelChange)="updateSubtip(sub, 'descripcion', $event)"
          />
        </label>

        <label class="grid min-w-0 gap-1.5">
          <span class="text-xs font-bold text-slate-600">Resultado</span>
          <p-select
            class="w-full"
            [styleClass]="resultClass(sub.etapaCambio)"
            appendTo="body"
            [options]="etapaOptions"
            optionLabel="label"
            optionValue="value"
            [ngModel]="sub.etapaCambio"
            (ngModelChange)="updateSubtip(sub, 'etapaCambio', $event)"
          />
        </label>

        <label class="grid min-w-0 gap-1.5">
          <span class="text-xs font-bold text-slate-600">Tipificación</span>
          <p-select
            class="w-full"
            appendTo="body"
            [options]="parentOptions"
            optionLabel="label"
            optionValue="value"
            [ngModel]="tip.uid"
            (ngModelChange)="subtipParentChange.emit({
              tipUid: tip.uid,
              subUid: sub.uid,
              targetTipUid: $event
            })"
          />
        </label>

        @if (sub.etapaCambio === 'POSTVENTA') {
          <label class="grid min-w-0 gap-1.5">
            <span class="text-xs font-bold text-slate-600">Estado de Postventa</span>
            <p-select
              class="w-full"
              appendTo="body"
              [options]="estadoPostventaOptions"
              [ngModel]="sub.estadoPostventaCambio"
              placeholder="Seleccionar"
              (ngModelChange)="updateSubtip(sub, 'estadoPostventaCambio', $event)"
            />
          </label>
        } @else {
          <span class="hidden xl:block"></span>
        }

        <div class="flex h-10 items-center justify-end gap-1">
          <div class="hidden xl:flex">
            <button
              pButton
              type="button"
              icon="pi pi-chevron-up"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              size="small"
              pTooltip="Subir"
              [disabled]="index === 0"
              (click)="moveSubtip.emit({ tipUid: tip.uid, subUid: sub.uid, direction: -1 })"
            ></button>
            <button
              pButton
              type="button"
              icon="pi pi-chevron-down"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              size="small"
              pTooltip="Bajar"
              [disabled]="index === tip.subtipificaciones.length - 1"
              (click)="moveSubtip.emit({ tipUid: tip.uid, subUid: sub.uid, direction: 1 })"
            ></button>
          </div>
          <button
            pButton
            type="button"
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            pTooltip="Quitar"
            (click)="removeSubtip.emit({ tipUid: tip.uid, subUid: sub.uid })"
          ></button>
        </div>
      </div>
    } @empty {
      <div class="rounded-md border border-dashed border-slate-300 px-4 py-6 text-center text-sm text-slate-500">
        Esta tipificación todavía no tiene opciones.
      </div>
    }

    <button
      pButton
      type="button"
      icon="pi pi-plus"
      label="Agregar subtipificación"
      severity="secondary"
      [text]="true"
      class="justify-self-start"
      (click)="addSubtip.emit(tip.uid)"
    ></button>

    <div
      class="h-3 rounded-sm transition-colors hover:bg-emerald-100"
      (dragover)="allowDrop($event)"
      (drop)="dropAt(tip.subtipificaciones.length, $event)"
    ></div>
  </div>
</div>

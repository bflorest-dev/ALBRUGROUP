<div class="compact-editor grid gap-4 p-4">
  <div class="grid items-end gap-3 lg:grid-cols-[minmax(12rem,0.8fr)_minmax(18rem,1.5fr)_auto]">
    <label class="grid min-w-0 gap-1.5">
      <span class="text-xs font-bold text-slate-600">Código</span>
      <input
        pInputText
        type="text"
        class="w-full"
        [ngModel]="tip.codigo"
        (ngModelChange)="updateTip('codigo', $event)"
      />
    </label>

    <label class="grid min-w-0 gap-1.5">
      <span class="text-xs font-bold text-slate-600">Descripción</span>
      <input
        pInputText
        type="text"
        class="w-full"
        [ngModel]="tip.descripcion"
        (ngModelChange)="updateTip('descripcion', $event)"
      />
    </label>

    <button
      pButton
      type="button"
      icon="pi pi-trash"
      label="Quitar"
      severity="danger"
      [text]="true"
      (click)="removeTip.emit(tip.uid)"
    ></button>
  </div>

  <div class="subtip-list grid gap-2.5 border-t border-dashed border-slate-200 pt-4">
    @for (sub of tip.subtipificaciones; track sub.uid; let index = $index) {
      <div
        class="subtip-row grid min-w-0 gap-2.5 rounded-md border border-slate-200 bg-slate-50 p-3"
        [class.has-postventa-state]="selectedEtapa === 'POSTVENTA' && sub.etapaCambio === 'POSTVENTA'"
        [class.dragging]="draggingSubUid === sub.uid"
        [class.drag-over]="dragOverIndex === index && draggingSubUid !== sub.uid"
        (dragover)="markDropTarget(index, $event)"
        (drop)="dropAt(index, $event)"
      >
        <div class="subtip-controls flex items-center gap-1">
          <button
            type="button"
            class="subtip-grip grid size-9 cursor-grab place-items-center rounded-md border-0 bg-transparent p-0 text-slate-400 hover:bg-slate-200 hover:text-slate-700"
            draggable="true"
            (dragstart)="startSubtipDrag(sub.uid, $event)"
            (dragend)="endSubtipDrag()"
          >
            <i class="pi pi-bars"></i>
          </button>
          <div class="subtip-mobile-order flex">
            <button
              pButton
              type="button"
              icon="pi pi-chevron-up"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              size="small"
              pTooltip="Subir"
              [disabled]="index === 0"
              (click)="moveSubtip.emit({ tipUid: tip.uid, subUid: sub.uid, direction: -1 })"
            ></button>
            <button
              pButton
              type="button"
              icon="pi pi-chevron-down"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              size="small"
              pTooltip="Bajar"
              [disabled]="index === tip.subtipificaciones.length - 1"
              (click)="moveSubtip.emit({ tipUid: tip.uid, subUid: sub.uid, direction: 1 })"
            ></button>
          </div>
        </div>

        <label class="grid min-w-0 gap-1.5">
          <span class="text-xs font-bold text-slate-600">Código</span>
          <input
            pInputText
            type="text"
            class="w-full"
            [ngModel]="sub.codigo"
            (ngModelChange)="updateSubtip(sub, 'codigo', $event)"
          />
        </label>

        <label class="grid min-w-0 gap-1.5">
          <span class="text-xs font-bold text-slate-600">Descripción</span>
          <input
            pInputText
            type="text"
            class="w-full"
            [ngModel]="sub.descripcion"
            (ngModelChange)="updateSubtip(sub, 'descripcion', $event)"
          />
        </label>

        <label class="grid min-w-0 gap-1.5">
          <span class="text-xs font-bold text-slate-600">Resultado</span>
          <p-select
            class="w-full"
            [styleClass]="resultClass(sub.etapaCambio)"
            appendTo="body"
            [options]="etapaOptions"
            optionLabel="label"
            optionValue="value"
            [ngModel]="sub.etapaCambio"
            (ngModelChange)="updateSubtip(sub, 'etapaCambio', $event)"
          >
            <ng-template pTemplate="selectedItem" let-selected>
              @if (selected) {
                <span class="flex min-w-0 items-center gap-2">
                  <i [class]="selected.icon"></i>
                  <span class="truncate">{{ selected.label }}</span>
                </span>
              }
            </ng-template>
            <ng-template pTemplate="item" let-option>
              <span class="flex items-center gap-2">
                <i
                  [class]="option.icon"
                  [class.text-slate-500]="option.direction === 'STAY'"
                  [class.text-amber-600]="option.direction === 'BACK'"
                  [class.text-emerald-600]="option.direction === 'FORWARD'"
                ></i>
                <span>{{ option.label }}</span>
              </span>
            </ng-template>
          </p-select>
        </label>

        @if (selectedEtapa === 'POSTVENTA' && sub.etapaCambio === 'POSTVENTA') {
          <label class="postventa-state grid min-w-0 gap-1.5">
            <span class="text-xs font-bold text-slate-600">Estado de Postventa</span>
            <p-select
              class="w-full"
              appendTo="body"
              [options]="estadoPostventaOptions"
              [ngModel]="sub.estadoPostventaCambio"
              placeholder="Seleccionar"
              (ngModelChange)="updateSubtip(sub, 'estadoPostventaCambio', $event)"
            />
          </label>
        } @else {
        }

        <div class="subtip-actions flex items-center justify-end gap-1">
          <div class="subtip-desktop-order hidden">
            <button
              pButton
              type="button"
              icon="pi pi-chevron-up"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              size="small"
              pTooltip="Subir"
              [disabled]="index === 0"
              (click)="moveSubtip.emit({ tipUid: tip.uid, subUid: sub.uid, direction: -1 })"
            ></button>
            <button
              pButton
              type="button"
              icon="pi pi-chevron-down"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              size="small"
              pTooltip="Bajar"
              [disabled]="index === tip.subtipificaciones.length - 1"
              (click)="moveSubtip.emit({ tipUid: tip.uid, subUid: sub.uid, direction: 1 })"
            ></button>
          </div>
          <button
            pButton
            type="button"
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            pTooltip="Quitar"
            (click)="removeSubtip.emit({ tipUid: tip.uid, subUid: sub.uid })"
          ></button>
        </div>
      </div>
    } @empty {
      <div class="rounded-md border border-dashed border-slate-300 px-4 py-6 text-center text-sm text-slate-500">
        Esta tipificación todavía no tiene opciones.
      </div>
    }

    <div class="flex justify-center">
      <button
        pButton
        type="button"
        icon="pi pi-plus"
        label="Agregar subtipificación"
        severity="secondary"
        [text]="true"
        (click)="addSubtip.emit(tip.uid)"
      ></button>
    </div>

    <div
      class="subtip-end-drop h-3 rounded-sm"
      [class.drag-over]="dragOverIndex === tip.subtipificaciones.length"
      (dragover)="markDropTarget(tip.subtipificaciones.length, $event)"
      (drop)="dropAt(tip.subtipificaciones.length, $event)"
    ></div>
  </div>
</div>

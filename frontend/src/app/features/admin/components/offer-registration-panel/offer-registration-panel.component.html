<form [formGroup]="createOfferForm" class="form-grid">
  <label class="field">
    <span>Codigo</span>
    <input pInputText type="text" formControlName="codigo" />
  </label>

  <label class="field">
    <span>Negocio</span>
    <p-select
      formControlName="negocio"
      [options]="optionItems(negocioOptions)"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
    />
  </label>

  <label class="field">
    <span>Puesto objetivo</span>
    <p-select
      formControlName="puestoObjetivo"
      [options]="optionItems(puestoObjetivoOptions)"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
    />
  </label>

  <label class="field">
    <span>Modalidad</span>
    <p-select
      formControlName="modalidad"
      [options]="optionItems(modalidadOptions)"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
    />
  </label>

  <label class="field">
    <span>Horario</span>
    <p-select
      formControlName="horario"
      [options]="optionItems(horarioOptions)"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
    />
  </label>

  <label class="field">
    <span>Cantidad inicial</span>
    <input pInputText type="number" formControlName="cantidadInicial" min="1" />
  </label>

  <label class="field">
    <span>Plazo inicial</span>
    <p-datepicker
      [ngModel]="toPickerDate(createOfferForm.get('plazoInicial')?.value)"
      [ngModelOptions]="{ standalone: true }"
      dateFormat="dd/mm/yy"
      [showIcon]="true"
      appendTo="body"
      (ngModelChange)="setDateControl(createOfferForm, 'plazoInicial', $event)"
    />
  </label>
</form>

@if (createErrorMessage) {
  <p-message severity="error" [text]="createErrorMessage" />
}

<div class="actions">
  <button
    pButton
    type="button"
    severity="secondary"
    [outlined]="true"
    icon="pi pi-times"
    label="Cancelar"
    (click)="cancel.emit()"
  ></button>
  <button
    pButton
    type="button"
    icon="pi pi-save"
    label="Guardar oferta"
    [loading]="isCreatingOffer"
    (click)="save.emit()"
  ></button>
</div>

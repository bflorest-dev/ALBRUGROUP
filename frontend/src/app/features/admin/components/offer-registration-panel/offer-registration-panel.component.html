<section class="panel panel--form">
  <div class="panel__header">
    <div>
      <span class="panel__eyebrow">Nueva oferta</span>
      <h3>Registrar oferta laboral</h3>
    </div>
  </div>

  <form [formGroup]="createOfferForm" class="form-grid">
    <label>
      <span>Codigo</span>
      <input type="text" formControlName="codigo" />
    </label>

    <label>
      <span>Negocio</span>
      <select formControlName="negocio">
        @for (option of negocioOptions; track option) {
          <option [value]="option">{{ toLabel(option) }}</option>
        }
      </select>
    </label>

    <label>
      <span>Puesto objetivo</span>
      <select formControlName="puestoObjetivo">
        @for (option of puestoObjetivoOptions; track option) {
          <option [value]="option">{{ toLabel(option) }}</option>
        }
      </select>
    </label>

    <label>
      <span>Modalidad</span>
      <select formControlName="modalidad">
        @for (option of modalidadOptions; track option) {
          <option [value]="option">{{ toLabel(option) }}</option>
        }
      </select>
    </label>

    <label>
      <span>Horario</span>
      <select formControlName="horario">
        @for (option of horarioOptions; track option) {
          <option [value]="option">{{ toLabel(option) }}</option>
        }
      </select>
    </label>

    <label>
      <span>Cantidad inicial</span>
      <input type="number" formControlName="cantidadInicial" min="1" />
    </label>

    <label>
      <span>Plazo inicial</span>
      <input type="date" formControlName="plazoInicial" />
    </label>
  </form>

  @if (createErrorMessage) {
    <p class="form-message form-message--error">{{ createErrorMessage }}</p>
  }

  <div class="actions">
    <button type="button" class="secondary-button" (click)="cancel.emit()">Cancelar</button>
    <button type="button" class="primary-button" [disabled]="isCreatingOffer" (click)="save.emit()">
      {{ isCreatingOffer ? 'Registrando...' : 'Guardar oferta' }}
    </button>
  </div>
</section>

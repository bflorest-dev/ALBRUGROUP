<form [formGroup]="createOfferForm" class="form-grid" (ngSubmit)="save.emit()" novalidate>
  <label class="field field--wide">
    <span>Código de oferta</span>
    <input pInputText type="text" formControlName="codigo" placeholder="Ej. OF-2026-001" />
    <small>Identifica esta demanda para que el equipo pueda encontrarla rápidamente.</small>
  </label>

  <label class="field">
    <span>Negocio</span>
    <p-select
      formControlName="negocio"
      [options]="optionItems(negocioOptions)"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
    />
    <small>Define la operación a la que pertenece la vacante.</small>
  </label>

  <label class="field">
    <span>Puesto objetivo</span>
    <p-select
      formControlName="puestoObjetivo"
      [options]="optionItems(puestoObjetivoOptions)"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
    />
    <small>Prioriza el rol que alimentará la bandeja de Reclutamiento.</small>
  </label>

  <label class="field">
    <span>Modalidad</span>
    <p-select
      formControlName="modalidad"
      [options]="optionItems(modalidadOptions)"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
    />
    <small>Indica cómo se organizará la jornada del equipo.</small>
  </label>

  <label class="field">
    <span>Horario</span>
    <p-select
      formControlName="horario"
      [options]="optionItems(horarioOptions)"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
    />
    <small>Selecciona el turno operativo de la oferta.</small>
  </label>

  <label class="field">
    <span>Vacantes iniciales</span>
    <input pInputText type="number" formControlName="cantidadInicial" min="1" placeholder="Ej. 10" />
    <small>Capacidad inicial que se habilitará para postulantes.</small>
  </label>

  <label class="field">
    <span>Plazo inicial</span>
    <p-datepicker
      [ngModel]="toPickerDate(createOfferForm.get('plazoInicial')?.value)"
      [ngModelOptions]="{ standalone: true }"
      dateFormat="dd/mm/yy"
      [showIcon]="true"
      appendTo="body"
      (ngModelChange)="setDateControl(createOfferForm, 'plazoInicial', $event)"
    />
    <small>Fecha hasta la que se considera vigente esta demanda.</small>
  </label>

  <div class="actions">
    <button type="button" class="button button--ghost" (click)="cancel.emit()">
      <i class="ti ti-x" aria-hidden="true"></i>
      Cancelar
    </button>
    <button type="submit" class="button button--primary" [disabled]="isCreatingOffer">
      <i class="ti ti-check" aria-hidden="true"></i>
      {{ isCreatingOffer ? 'Procesando…' : 'Registrar oferta' }}
    </button>
  </div>
</form>

@if (createErrorMessage) {
  <div class="inline-notice inline-notice--error" role="alert">
    <i class="ti ti-alert-circle" aria-hidden="true"></i>
    <span>{{ createErrorMessage }}</span>
  </div>
}

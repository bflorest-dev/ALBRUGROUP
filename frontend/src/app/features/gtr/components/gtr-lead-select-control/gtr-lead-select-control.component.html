<button
  type="button"
  class="gtr-select"
  [class.gtr-select--selected]="selected()"
  [class.gtr-select--partial]="partial()"
  [disabled]="disabled()"
  [attr.aria-pressed]="selected()"
  [attr.aria-label]="ariaLabel()"
  [attr.title]="title()"
  (click)="toggleSelection()"
>
  @if (selected()) {
    <i class="pi pi-check" aria-hidden="true"></i>
  } @else if (partial()) {
    <i class="pi pi-minus" aria-hidden="true"></i>
  }
</button>

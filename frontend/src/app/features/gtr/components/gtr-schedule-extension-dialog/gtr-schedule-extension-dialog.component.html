<p-dialog
  header="Ajustar jornada"
  [visible]="visible()"
  (visibleChange)="!$event && close()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '44rem', maxWidth: '96vw' }"
  styleClass="gtr-extension-dialog"
>
  <app-schedule-extension-timeline
    [jornada]="facade.extensionJornada()"
    [employeeName]="facade.extensionTarget()?.nombreCompleto ?? ''"
    [loading]="facade.isLoadingExtensionContext()"
    [saving]="facade.isSavingExtension()"
    [error]="facade.extensionError()"
    mode="extra"
    (cancel)="close()"
    (saveRequested)="onSave($event)"
  />
</p-dialog>

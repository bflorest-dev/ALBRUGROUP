<app-schedule-adjustment-dialog
  [visible]="facade.activeDialog() === 'schedule-extension'"
  [employeeName]="facade.extensionTarget()?.nombreCompleto ?? ''"
  [selectedDate]="facade.today"
  [allowDateChange]="false"
  [jornada]="facade.extensionJornada()"
  [preview]="facade.extensionPreview()"
  [loading]="facade.isLoadingExtensionContext()"
  [saving]="facade.isSavingExtension()"
  [error]="facade.extensionError()"
  (closed)="facade.closeScheduleExtension()"
  (previewRequested)="facade.previewScheduleExtension($event)"
  (saveRequested)="facade.submitScheduleExtension($event)"
/>

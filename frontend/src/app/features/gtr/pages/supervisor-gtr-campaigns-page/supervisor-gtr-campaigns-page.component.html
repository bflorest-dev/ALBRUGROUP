<main class="supervisor-gtr-campaigns-page">
  <header class="supervisor-gtr-campaigns-page__header">
    <div>
      <h1>Operación de campañas</h1>
      <p>Distribuye campañas entre tus equipos y revisa la actividad PREVENTA por proveedor.</p>
    </div>
  </header>

  @if (facade.error()) {
    <p-message severity="error">{{ facade.error() }}</p-message>
  }
  @if (facade.exito()) {
    <p-message severity="success">{{ facade.exito() }}</p-message>
  }

  <app-supervisor-gtr-campaign-assignment
    [equipos]="facade.equipos()"
    [equipoSeleccionadoId]="facade.equipoSeleccionadoId()"
    [equipoSeleccionado]="facade.equipoSeleccionado()"
    [campanas]="facade.campanas()"
    [cargando]="facade.cargando() || facade.cargandoCampanas()"
    [guardando]="facade.guardando()"
    (equipoChange)="onEquipoChange($event)"
    (save)="onSave($event)"
  />

  <app-supervisor-gtr-provider-metrics
    [metricas]="facade.metricas()"
    [cargando]="facade.cargando()"
  />
</main>

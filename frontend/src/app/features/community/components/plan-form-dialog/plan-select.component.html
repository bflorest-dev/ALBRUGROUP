<details #menu class="plan-select" [class.is-disabled]="disabled">
  <summary
    class="plan-select__summary"
    [attr.aria-haspopup]="'listbox'"
    [attr.aria-expanded]="menu.open"
    (click)="preventToggle($event)"
  >
    <span class="plan-select__label">{{ label }}</span>
    <span class="plan-select__trigger">
      <strong>{{ selectedLabel }}</strong>
      <i class="ti ti-chevron-down" aria-hidden="true"></i>
    </span>
  </summary>

  <div class="plan-select__menu" role="listbox" [attr.aria-label]="label">
    @for (option of options; track option.value) {
      <button
        type="button"
        role="option"
        class="plan-select__option"
        [class.active]="isSelected(option)"
        [class.is-disabled]="option.disabled"
        [attr.aria-selected]="isSelected(option)"
        [disabled]="option.disabled || disabled"
        (click)="choose(option, menu)"
      >
        <span>{{ option.label }}</span>
        @if (isSelected(option)) {
          <i class="ti ti-check" aria-hidden="true"></i>
        }
      </button>
    }
  </div>
</details>

<section class="auth-page">
  <div class="auth-card">
    <span class="auth-card__eyebrow">Primer acceso</span>
    <h1>Inicializa tu password</h1>
    <p>
      Como tu password aun no esta inicializada, valida tu identidad para generar una nueva clave.
    </p>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="submit()" class="auth-form">
      <label>
        <span>Username</span>
        <input type="text" formControlName="username" />
      </label>

      <label>
        <span>Email</span>
        <input type="email" formControlName="email" placeholder="Ingresa tu email" />
      </label>

      <label>
        <span>DNI</span>
        <input type="text" formControlName="dni" placeholder="Ingresa tu DNI" />
      </label>

      @if (errorMessage()) {
        <p class="form-message form-message--error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Generando...' : 'Generar password' }}
      </button>
    </form>

    @if (generatedCredentials(); as credentials) {
      <div class="credentials-box">
        <h2>Nueva password generada</h2>
        <div class="credentials-row">
          <p class="credentials-box__value">{{ credentials.password }}</p>
          <button
            type="button"
            class="copy-button"
            (click)="copyPassword(credentials.password)"
            aria-label="Copiar password"
          >
            <i class="ti ti-copy app-icon app-icon--accent" aria-hidden="true"></i>
          </button>
        </div>
        <button type="button" class="secondary-button" (click)="continueToLogin()">
          Ir al login
        </button>
      </div>
    }
  </div>
</section>

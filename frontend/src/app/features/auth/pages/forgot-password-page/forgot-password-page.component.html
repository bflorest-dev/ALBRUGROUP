<p-card styleClass="auth-card auth-card--wide">
  <div class="auth-card__header">
    <span class="auth-card__eyebrow">Primer acceso</span>
    <h1>Inicializa tu password</h1>
    <p>Como tu password aun no esta inicializada, valida tu identidad para generar una nueva clave.</p>
  </div>

  <form [formGroup]="forgotPasswordForm" (ngSubmit)="submit()" class="auth-form">
    <label class="auth-field">
      <span>Username</span>
      <input pInputText type="text" formControlName="username" autocomplete="username" />
    </label>

    <label class="auth-field">
      <span>Email</span>
      <input pInputText type="email" formControlName="email" placeholder="Ingresa tu email" autocomplete="email" />
    </label>

    <label class="auth-field">
      <span>DNI</span>
      <input pInputText type="text" formControlName="dni" placeholder="Ingresa tu DNI" autocomplete="off" />
    </label>

    @if (errorMessage()) {
      <p-message severity="error" [text]="errorMessage()" />
    }

    <button
      pButton
      type="submit"
      class="auth-submit"
      icon="pi pi-key"
      iconPos="right"
      [loading]="isSubmitting()"
      [disabled]="isSubmitting()"
    >
      <span pButtonLabel>Generar password</span>
    </button>
  </form>

  @if (generatedCredentials(); as credentials) {
    <div class="credentials-box">
      <div>
        <span class="credentials-box__eyebrow">Credencial temporal</span>
        <h2>Nueva password generada</h2>
      </div>

      <div class="credentials-row">
        <p class="credentials-box__value">{{ credentials.password }}</p>
        <button
          pButton
          type="button"
          icon="pi pi-copy"
          severity="secondary"
          class="copy-button"
          (click)="copyPassword(credentials.password)"
          aria-label="Copiar password"
        ></button>
      </div>

      <button pButton type="button" icon="pi pi-arrow-right" iconPos="right" severity="secondary" (click)="continueToLogin()">
        <span pButtonLabel>Ir al login</span>
      </button>
    </div>
  }
</p-card>

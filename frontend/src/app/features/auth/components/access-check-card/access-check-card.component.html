<p-card styleClass="auth-card">
  <div class="auth-card__header">
    <span class="auth-card__eyebrow">Ingreso operativo</span>
    <h1>Valida tu acceso</h1>
    <p>Ingresa tu username para verificar si tu cuenta puede entrar al sistema.</p>
  </div>

  <form [formGroup]="accessForm" (ngSubmit)="formSubmit.emit()" class="auth-form">
    <label class="auth-field">
      <span>Username</span>
      <input pInputText type="text" formControlName="username" placeholder="Ingresa tu username" autocomplete="username" />
    </label>

    @if (errorMessage) {
      <p-message severity="error" [text]="errorMessage" />
    }

    <button
      pButton
      type="submit"
      class="auth-submit"
      icon="pi pi-arrow-right"
      iconPos="right"
      [loading]="isSubmitting"
      [disabled]="isSubmitting"
    >
      <span pButtonLabel>Continuar</span>
    </button>
  </form>
</p-card>

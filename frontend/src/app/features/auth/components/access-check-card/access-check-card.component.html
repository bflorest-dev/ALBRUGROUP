<p-card styleClass="auth-card">
  <div class="auth-steps" aria-hidden="true">
    <span class="auth-steps__dot auth-steps__dot--active"></span>
    <span class="auth-steps__line"></span>
    <span class="auth-steps__dot"></span>
    <span class="auth-steps__line"></span>
    <span class="auth-steps__dot"></span>
  </div>

  <div class="auth-card__header">
    <h1>Valida tu acceso</h1>
  </div>

  <form [formGroup]="accessForm" (ngSubmit)="formSubmit.emit()" class="auth-form">
    <label class="auth-field">
      <span>Username</span>
      <p-iconfield iconPosition="left">
        <p-inputicon class="pi pi-user" />
        <input #usernameInput pInputText type="text" formControlName="username" placeholder="Ingresa tu username" autocomplete="username" />
      </p-iconfield>
    </label>

    @if (errorMessage) {
      <p-message severity="error" [text]="errorMessage" />
    }

    <button
      pButton
      type="submit"
      class="auth-submit"
      icon="pi pi-arrow-right"
      iconPos="right"
      [loading]="isSubmitting"
      [disabled]="isSubmitting"
    >
      <span pButtonLabel>Continuar</span>
    </button>
  </form>

  <p class="auth-quote">"Grandes logros comienzan con un simple paso."</p>
</p-card>

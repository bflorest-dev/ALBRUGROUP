<p-card styleClass="auth-card auth-card--wide">
  <div class="auth-steps" aria-hidden="true">
    <span class="auth-steps__dot auth-steps__dot--done"></span>
    <span class="auth-steps__line auth-steps__line--done"></span>
    <span class="auth-steps__dot auth-steps__dot--done"></span>
    <span class="auth-steps__line auth-steps__line--done"></span>
    <span class="auth-steps__dot auth-steps__dot--active"></span>
  </div>

  <button pButton type="button" class="auth-back" severity="secondary" text icon="pi pi-arrow-left" (click)="back.emit()">
    <span pButtonLabel>Volver</span>
  </button>

  <div class="auth-card__header">
    <h1>Inicializa tu password</h1>
  </div>

  <form [formGroup]="forgotPasswordForm" (ngSubmit)="formSubmit.emit()" class="auth-form">
    <label class="auth-field">
      <span>Username</span>
      <p-iconfield iconPosition="left">
        <p-inputicon class="pi pi-user" />
        <input pInputText type="text" formControlName="username" autocomplete="username" />
      </p-iconfield>
    </label>

    <label class="auth-field">
      <span>Email</span>
      <p-iconfield iconPosition="left">
        <p-inputicon class="pi pi-envelope" />
        <input #emailInput pInputText type="email" formControlName="email" placeholder="Ingresa tu email" autocomplete="email" />
      </p-iconfield>
    </label>

    <label class="auth-field">
      <span>DNI</span>
      <p-iconfield iconPosition="left">
        <p-inputicon class="pi pi-id-card" />
        <input pInputText type="text" formControlName="dni" placeholder="Ingresa tu DNI" autocomplete="off" />
      </p-iconfield>
    </label>

    @if (errorMessage) {
      <p-message severity="error" [text]="errorMessage" />
    }

    <button
      pButton
      type="submit"
      class="auth-submit"
      icon="pi pi-key"
      iconPos="right"
      [loading]="isSubmitting"
      [disabled]="isSubmitting"
    >
      <span pButtonLabel>Generar password</span>
    </button>
  </form>

  @if (generatedCredentials; as credentials) {
    <div class="credentials-box">
      <div>
        <span class="credentials-box__eyebrow">Credencial temporal</span>
        <h2>Nueva password generada</h2>
      </div>

      <div class="credentials-row">
        <p class="credentials-box__value">{{ credentials.password }}</p>
        <button
          pButton
          type="button"
          icon="pi pi-copy"
          severity="secondary"
          class="copy-button"
          (click)="copyPassword.emit(credentials.password)"
          aria-label="Copiar password"
        ></button>
      </div>

      @if (copyFeedbackMessage) {
        <p-message [severity]="copyFeedbackSeverity" [text]="copyFeedbackMessage" />
      }

      <button pButton type="button" icon="pi pi-arrow-right" iconPos="right" severity="secondary" (click)="continueToLogin.emit()">
        <span pButtonLabel>Ir al login</span>
      </button>
    </div>
  }

  <p class="auth-quote">"Cada nuevo comienzo es una oportunidad para crecer."</p>
</p-card>

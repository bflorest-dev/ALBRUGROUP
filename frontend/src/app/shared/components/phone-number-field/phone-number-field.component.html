<div class="phone-field">
  <span class="phone-field__label">{{ label }}</span>

  <div class="phone-field__control">
    <span class="phone-field__plus" aria-hidden="true">+</span>
    <input
      type="text"
      inputmode="numeric"
      class="phone-field__prefix"
      [value]="prefixDigits"
      [placeholder]="prefixPlaceholder"
      [disabled]="prefixControl.disabled"
      aria-label="Prefijo telefonico"
      (input)="onPrefixInput($event)"
      (blur)="prefixControl.markAsTouched()"
    />

    <span class="phone-field__separator" aria-hidden="true"></span>

    <input
      #numberInput
      type="text"
      inputmode="numeric"
      class="phone-field__number"
      [formControl]="numberControl"
      [placeholder]="numberPlaceholder"
      autocomplete="off"
      aria-label="Numero telefonico"
      (input)="onNumberInput($event)"
    />
  </div>

  @if (showNumberInvalidMessage) {
    <span class="phone-field__error">{{ numberInvalidMessage }}</span>
  }
</div>

<section class="attendance-status">
  <button
    type="button"
    class="attendance-status__trigger"
    [class.is-open]="isOpen()"
    [disabled]="isLoading"
    [attr.aria-expanded]="isOpen()"
    (click)="toggleOpen()"
  >
    <p-tag [value]="statusLabel" [style]="statusTagStyle()" />
    @if (isLoading) {
      <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
    } @else {
      <i [class]="isOpen() ? 'pi pi-angle-up' : 'pi pi-angle-down'" aria-hidden="true"></i>
    }
  </button>

  @if (isOpen()) {
    <div class="attendance-status__menu">
      @if (actions.length) {
        @for (action of actions; track action.id) {
          <button type="button" class="attendance-status__option" (click)="selectAction(action)">
            <p-tag [value]="action.label" [style]="statusTagStyle(getOptionColor(action))" />
          </button>
        }
      } @else {
        <span class="attendance-status__empty">Sin acciones</span>
      }

      @if (errorMessage) {
        <button type="button" class="attendance-status__retry" (click)="retry.emit()">
          <i class="pi pi-refresh" aria-hidden="true"></i>
          <span>Reintentar</span>
        </button>
      }
    </div>
  }

  <p-dialog
    header="Confirmar salida"
    [visible]="pendingConfirmation() !== null"
    (visibleChange)="!$event && cancelPendingAction()"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    styleClass="attendance-confirm-dialog"
  >
    @if (pendingConfirmation()) {
      <p>Vas a cerrar tu jornada de hoy. Despues de marcar salida no podras volver a ONLINE en esta fecha.</p>
      <div class="attendance-status__confirm-actions">
        <button
          pButton
          type="button"
          severity="secondary"
          [outlined]="true"
          label="Cancelar"
          (click)="cancelPendingAction()"
        ></button>
        <button
          pButton
          type="button"
          severity="danger"
          label="Confirmar salida"
          (click)="confirmPendingAction()"
        ></button>
      </div>
    }
  </p-dialog>
</section>

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html: nunca cachear — el navegador siempre verifica con el servidor.
    # Esto garantiza que tras un rebuild se cargue el bundle nuevo sin hard-refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # Archivos con hash en el nombre (chunk-*.js, main-*.js, styles-*.css):
    # cachear 1 año — si cambia el contenido, cambia el nombre del archivo.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Resto de assets estaticos (iconos, fuentes, imagenes)
    location ~* \.(ico|png|jpg|jpeg|svg|webp|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Fallback SPA: cualquier ruta que no sea un archivo va a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

spring:
  application:
    name: billing-service
  datasource:
    url: ${BILLING_DB_URL:jdbc:h2:mem:billing_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${BILLING_DB_USERNAME:sa}
    password: ${BILLING_DB_PASSWORD:}
    driver-class-name: ${BILLING_DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8087}

billing:
  timezone: America/Lima
  internal-secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}
  services:
    rrhh-url: ${RRHH_SERVICE_URL:http://localhost:8082}
    schedule-url: ${SCHEDULE_SERVICE_URL:http://localhost:8085}
    lead-url: ${LEAD_SERVICE_URL:http://localhost:8083}

jwt:
  public-key-base64: ${JWT_PUBLIC_KEY_BASE64:}
  issuer: ${JWT_ISSUER:}
  token-version: ${JWT_TOKEN_VERSION:2}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

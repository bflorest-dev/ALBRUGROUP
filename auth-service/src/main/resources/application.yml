server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

jwt:
  secret: ${JWT_SECRET:3bZ4bR0S5c7hFQ2nTzF8oQv9vKxM2yP7aLw8eJrHkU1cNdWqXyZp6tR9mVb4sL0Q8nF5gH2kJ3lP6rS9uVw==}
  expiration: ${JWT_EXPIRATION:30m}
  issuer: ${JWT_ISSUER:https://api.albrugroup.com/auth}

app:
  docs:
    gateway-url: ${AUTH_DOCS_GATEWAY_URL:http://localhost:8080/auth}
    public-url: ${AUTH_DOCS_PUBLIC_URL:https://api.albrugroup.com/auth}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

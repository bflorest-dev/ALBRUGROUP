server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

jwt:
  private-key-base64: ${JWT_PRIVATE_KEY_BASE64}
  public-key-base64: ${JWT_PUBLIC_KEY_BASE64}
  expiration: ${JWT_EXPIRATION:15m}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:8h}
  issuer: ${JWT_ISSUER}

app:
  docs:
    gateway-url: ${AUTH_DOCS_GATEWAY_URL:http://localhost:8080/auth}
    public-url: ${AUTH_DOCS_PUBLIC_URL:https://api.albrugroup.com/auth}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

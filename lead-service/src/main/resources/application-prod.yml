spring:
  data:
    redis:
      host: ${LEAD_REDIS_HOST:localhost}
      port: ${LEAD_REDIS_PORT:6379}
      timeout: 2000ms
  datasource:
    url: ${LEAD_DB_URL:jdbc:postgresql://localhost:5432/lead_db}
    username: ${LEAD_DB_USERNAME:postgres}
    password: ${LEAD_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.sql: INFO
    pe.albrugroup.lead_service: INFO

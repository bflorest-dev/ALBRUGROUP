server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: lead-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cache:
    type: redis

jwt:
  public-key-base64: ${JWT_PUBLIC_KEY_BASE64}
  issuer: ${JWT_ISSUER}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cache:
    ttl:
      catalogos: 12h
  lead:
    intake:
      masivo:
        id-campana-base: ${LEAD_INTAKE_MASIVO_ID_CAMPANA_BASE:1}
  docs:
    gateway-url: ${LEAD_DOCS_GATEWAY_URL:http://localhost:8080/leads}
    public-url: ${LEAD_DOCS_PUBLIC_URL:https://api.albrugroup.com/leads}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

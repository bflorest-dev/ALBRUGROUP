server:
  port: 8083

spring:
  application:
    name: lead-service
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  datasource:
    url: jdbc:h2:mem:authdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

jwt:
  secret: 3bZ4bR0S5c7hFQ2nTzF8oQv9vKxM2yP7aLw8eJrHkU1cNdWqXyZp6tR9mVb4sL0Q8nF5gH2kJ3lP6rS9uVw==

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.sql: DEBUG
    pe.albrugroup.auth_service: DEBUG


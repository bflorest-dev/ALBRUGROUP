server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: recruitment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cache:
    type: redis

jwt:
  secret: ${JWT_SECRET:3bZ4bR0S5c7hFQ2nTzF8oQv9vKxM2yP7aLw8eJrHkU1cNdWqXyZp6tR9mVb4sL0Q8nF5gH2kJ3lP6rS9uVw==}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cache:
    ttl:
      catalogos: 12h
  docs:
    gateway-url: ${RECRUITMENT_DOCS_GATEWAY_URL:http://localhost:8080/recruitment}
    public-url: ${RECRUITMENT_DOCS_PUBLIC_URL:https://api.albrugroup.com/recruitment}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  port: 8084

spring:
  application:
    name: recruitment-service

  datasource:
    url: jdbc:h2:mem:recruitmentdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:

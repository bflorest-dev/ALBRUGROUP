server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: recruitment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cache:
    type: redis

jwt:
  public-key-base64: ${JWT_PUBLIC_KEY_BASE64}
  issuer: ${JWT_ISSUER}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cache:
    ttl:
      catalogos: 12h
  docs:
    gateway-url: ${RECRUITMENT_DOCS_GATEWAY_URL:http://localhost:8080/recruitment}
    public-url: ${RECRUITMENT_DOCS_PUBLIC_URL:https://api.albrugroup.com/recruitment}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

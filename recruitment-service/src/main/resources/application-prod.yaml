spring:
  data:
    redis:
      host: ${RECRUITMENT_REDIS_HOST:localhost}
      port: ${RECRUITMENT_REDIS_PORT:6379}
      timeout: 2000ms
  datasource:
    url: ${RECRUITMENT_DB_URL:jdbc:postgresql://localhost:5432/recruitment_db}
    username: ${RECRUITMENT_DB_USERNAME:postgres}
    password: ${RECRUITMENT_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

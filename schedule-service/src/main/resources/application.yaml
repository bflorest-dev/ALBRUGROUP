server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: schedule-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

jwt:
  public-key-base64: ${JWT_PUBLIC_KEY_BASE64}
  issuer: ${JWT_ISSUER}

internal:
  shared-secret: ${INTERNAL_SHARED_SECRET:}

app:
  docs:
    gateway-url: ${SCHEDULE_DOCS_GATEWAY_URL:http://localhost:8080/schedule}
    public-url: ${SCHEDULE_DOCS_PUBLIC_URL:https://api.albrugroup.com/schedule}

schedule:
  engine:
    mode: ${SCHEDULE_ENGINE_MODE:SHADOW}
    effective-from: ${SCHEDULE_ENGINE_EFFECTIVE_FROM:2026-06-15}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

spring:
  datasource:
    url: ${SCHEDULE_DB_URL:jdbc:postgresql://localhost:5432/schedule_db}
    username: ${SCHEDULE_DB_USERNAME:postgres}
    password: ${SCHEDULE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

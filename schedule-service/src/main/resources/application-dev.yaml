spring:
  datasource:
    url: jdbc:h2:mem:scheduledb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

schedule:
  engine:
    mode: ${SCHEDULE_ENGINE_MODE:ALL}
    effective-from: ${SCHEDULE_ENGINE_EFFECTIVE_FROM:2026-06-15}

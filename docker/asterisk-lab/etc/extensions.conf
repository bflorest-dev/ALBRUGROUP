; ============================================================================
; extensions.conf - Dialplan minimo
; ============================================================================
[general]
static = yes
writeprotect = no
clearglobalvars = no

[globals]
STASIS_APP = albrugroup-stasis

; --------------------------------------------------------------------------
; CONTEXTO INTERNAL: llamadas entre extensiones (asesor a asesor / cliente sim)
; --------------------------------------------------------------------------
[internal]
; 1001-1003: asesores
exten => _1XXX,1,NoOp(Llamada interna a ${EXTEN})
 same => n,Set(__LEAD_ID=${LEAD_ID})
 same => n,Set(__CAMPANA_ID=${CAMPANA_ID})
 same => n,Dial(PJSIP/${EXTEN},30,tT)
 same => n,Hangup()

; 9999: cliente simulado
exten => 9999,1,NoOp(Llamada a cliente simulado)
 same => n,Dial(PJSIP/9999,30,tT)
 same => n,Hangup()

; Entrada a la cola de ventas
exten => 100,1,NoOp(Entrando a cola-ventas)
 same => n,Answer()
 same => n,Set(CHANNEL(language)=es)
 same => n,Stasis(${STASIS_APP},queue=cola-ventas,${LEAD_ID},${CAMPANA_ID})
 same => n,Hangup()

; --------------------------------------------------------------------------
; CONTEXTO FROM-CALL-SERVICE: punto de entrada de Originate desde ARI/AMI
; call-service inyecta variables LEAD_ID y CAMPANA_ID en el canal.
; --------------------------------------------------------------------------
[from-call-service]
; Variante 1: el call-service inyecta a la cola
exten => queue,1,NoOp(Llamada saliente entrando a cola via Stasis)
 same => n,Answer()
 same => n,MixMonitor(${UNIQUEID}.wav,b,)
 same => n,Stasis(${STASIS_APP},queue=cola-ventas,${LEAD_ID},${CAMPANA_ID})
 same => n,Hangup()

; Variante 2: entrega directa a una extension especifica
exten => _direct-1XXX,1,NoOp(Originate hacia ${EXTEN:7})
 same => n,Set(__LEAD_ID=${LEAD_ID})
 same => n,Set(__CAMPANA_ID=${CAMPANA_ID})
 same => n,MixMonitor(${UNIQUEID}.wav,b,)
 same => n,Dial(PJSIP/${EXTEN:7},30,tT)
 same => n,Hangup()

; --------------------------------------------------------------------------
; CONTEXTO STASIS (catch-all si algo entra sin direccion)
; --------------------------------------------------------------------------
[stasis-default]
exten => _.,1,NoOp(Entrando a Stasis app)
 same => n,Stasis(${STASIS_APP})
 same => n,Hangup()

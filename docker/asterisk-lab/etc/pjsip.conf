; ============================================================================
; pjsip.conf - Endpoints SIP (asesores) y transportes
; Fase 1: 4 endpoints de prueba (1001, 1002, 1003 = asesores; 9999 = cliente).
; ============================================================================

; --------------------------------------------------------------------------
; TRANSPORTES
; --------------------------------------------------------------------------
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; En produccion, descomentar y poner la IP publica del servidor:
; external_media_address = <IP_PUBLICA>
; external_signaling_address = <IP_PUBLICA>

[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0:8088
; Fase 1: WS plano para pruebas locales. Fase 2: cambiar a wss con cert.

; --------------------------------------------------------------------------
; PLANTILLA: endpoint de asesor (WebRTC desde navegador)
; --------------------------------------------------------------------------
[asesor-webrtc](!)
type = endpoint
context = internal
disallow = all
allow = opus,ulaw,alaw
transport = transport-ws
webrtc = yes
direct_media = no
ice_support = yes
use_avpf = yes
media_use_received_transport = yes
rtcp_mux = yes
dtls_auto_generate_cert = yes
force_rport = yes
rewrite_contact = yes

[asesor-auth](!)
type = auth
auth_type = userpass

[asesor-aor](!)
type = aor
max_contacts = 5
remove_existing = yes

; --------------------------------------------------------------------------
; ASESOR 1001
; --------------------------------------------------------------------------
[1001](asesor-webrtc)
auth = 1001
aors = 1001
callerid = "Asesor 1001" <1001>

[1001](asesor-auth)
username = 1001
password = asesor1001

[1001](asesor-aor)

; --------------------------------------------------------------------------
; ASESOR 1002
; --------------------------------------------------------------------------
[1002](asesor-webrtc)
auth = 1002
aors = 1002
callerid = "Asesor 1002" <1002>

[1002](asesor-auth)
username = 1002
password = asesor1002

[1002](asesor-aor)

; --------------------------------------------------------------------------
; ASESOR 1003
; --------------------------------------------------------------------------
[1003](asesor-webrtc)
auth = 1003
aors = 1003
callerid = "Asesor 1003" <1003>

[1003](asesor-auth)
username = 1003
password = asesor1003

[1003](asesor-aor)

; --------------------------------------------------------------------------
; CLIENTE SIMULADO (9999) - registrable por cualquier softphone para pruebas
; --------------------------------------------------------------------------
[9999](asesor-webrtc)
auth = 9999
aors = 9999
callerid = "Cliente simulado" <9999>

[9999](asesor-auth)
username = 9999
password = cliente9999

[9999](asesor-aor)

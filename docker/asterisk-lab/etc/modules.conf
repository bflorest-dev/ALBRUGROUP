; ============================================================================
; modules.conf - Que modulos cargar
; Estrategia: autoload=yes para que Asterisk resuelva dependencias internas,
; con noload selectivo para modulos no usados en este despliegue.
; ============================================================================
[modules]
autoload = yes

; No usamos realtime/ODBC en esta fase. La imagen actual no compila estos
; modulos porque no instala unixODBC, asi que no deben ser preload.

; Excluir SIP legacy: usamos solo PJSIP
noload = chan_sip.so

; Excluir IAX2 (no lo usamos)
noload = chan_iax2.so

; Excluir modulos opcionales que en autoload declinan por configs ausentes
; o no son parte del flujo ARI/AMI/PJSIP actual.
noload = res_odbc.so
noload = res_config_odbc.so
noload = res_prometheus.so
noload = res_stun_monitor.so
noload = res_phoneprov.so
noload = res_pjsip_phoneprov_provider.so
noload = res_hep.so
noload = res_hep_rtcp.so
noload = res_hep_pjsip.so
noload = res_pjsip_notify.so
noload = app_confbridge.so
noload = app_page.so
noload = res_calendar.so
noload = app_agent_pool.so
noload = res_parking.so
noload = cel_manager.so
noload = cdr_manager.so
noload = cdr_custom.so
noload = cdr_csv.so
noload = cel_custom.so
noload = cdr_sqlite3_custom.so
noload = cel_sqlite3_custom.so
noload = app_amd.so
noload = app_festival.so
noload = pbx_dundi.so
noload = app_alarmreceiver.so
noload = app_followme.so
noload = pbx_ael.so
noload = chan_unistim.so
noload = res_adsi.so
noload = app_adsiprog.so
noload = app_getcpeid.so

; Asegurar carga de modulos clave
require = res_pjsip.so
require = res_pjsip_session.so
require = chan_pjsip.so
require = res_ari.so
require = res_ari_channels.so
require = res_ari_bridges.so
require = res_ari_recordings.so
require = res_ari_playbacks.so
require = res_ari_endpoints.so
require = res_ari_events.so
require = res_ari_applications.so
require = res_http_websocket.so
require = res_stasis.so
require = res_stasis_recording.so
require = res_stasis_playback.so
require = app_stasis.so
require = app_queue.so
require = app_mixmonitor.so
require = app_dial.so
require = app_playback.so
require = app_originate.so
require = app_voicemail.so
require = res_musiconhold.so
require = res_rtp_asterisk.so
require = res_srtp.so
require = manager.so

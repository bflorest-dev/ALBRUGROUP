; ============================================================================
; ari.conf - Asterisk REST Interface
; ============================================================================
[general]
enabled = yes
pretty = yes
allowed_origins = *
auth_realm = albrugroup-ari
; Permite logueos basicos
websocket_write_timeout = 100

; Usuario que usa call-service
[callservice]
type = user
read_only = no
password = callservice_secret
password_format = plain

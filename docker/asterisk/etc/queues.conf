; ============================================================================
; queues.conf - Colas de distribucion de llamadas
; ============================================================================
[general]
persistentmembers = yes
autofill = yes
monitor-type = MixMonitor
shared_lastcall = yes
log_membername_as_agent = yes

; --------------------------------------------------------------------------
; Cola de ventas (Fase 1)
; --------------------------------------------------------------------------
[cola-ventas]
strategy = rrmemory                   ; Round-robin con memoria (justo entre asesores)
timeout = 20                          ; Segundos que suena cada asesor
retry = 5                             ; Segundos antes de reintentar al siguiente
wrapuptime = 10                       ; Segundos de wrap-up post llamada
maxlen = 0                            ; Sin limite de espera en cola
announce-frequency = 30               ; Anuncio cada 30s
announce-holdtime = no
musicclass = default
joinempty = yes                       ; Permitir entrar aunque no haya agentes
leavewhenempty = no
ringinuse = no
autopause = no                        ; No pausar agente si no contesta (lo manejamos en Java)

; Los miembros se agregan dinamicamente desde call-service via AMI (QueueAdd).
; Estos seeds estaticos son opcionales para pruebas iniciales.
; Formato: member => Interface,Penalty,MemberName
member => PJSIP/1001,0,Asesor 1001
member => PJSIP/1002,0,Asesor 1002
member => PJSIP/1003,0,Asesor 1003

; ============================================================================
; extensions.conf - Dialplan minimo
;
; FASE 1: usamos app_queue (built-in) en vez de Stasis. Esto dispara los eventos
; AMI Join/AgentCalled/AgentConnect/AgentComplete/QueueCallerAbandon/Hangup que
; EventDispatcher.java ya procesa y persiste en Postgres.
;
; FASE 2: se cambiara a Stasis(${STASIS_APP},...) para que call-service decida
; el routing programaticamente (predictive dialer, screen-pop, etc.).
; ============================================================================
[general]
static = yes
writeprotect = no
clearglobalvars = no

[globals]
STASIS_APP = albrugroup-stasis

; --------------------------------------------------------------------------
; CONTEXTO INTERNAL: llamadas entre extensiones (asesor a asesor / cliente sim)
; --------------------------------------------------------------------------
[internal]
; 1001-1003: asesores -> dial directo a otro asesor
exten => _1XXX,1,NoOp(Llamada interna a ${EXTEN})
 same => n,Set(__LEAD_ID=${LEAD_ID})
 same => n,Set(__CAMPANA_ID=${CAMPANA_ID})
 same => n,Dial(PJSIP/${EXTEN},30,tT)
 same => n,Hangup()

; 9999: cliente simulado (otro softphone se registra como 9999)
exten => 9999,1,NoOp(Llamada a cliente simulado)
 same => n,Dial(PJSIP/9999,30,tT)
 same => n,Hangup()

; --------------------------------------------------------------------------
; 100: entrada a cola-ventas
; El cliente (real o simulado) marca 100 y entra a la cola via app_queue.
; --------------------------------------------------------------------------
exten => 100,1,NoOp(Entrando a cola-ventas desde ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(CHANNEL(language)=es)
 same => n,MixMonitor(/var/spool/asterisk/recording/${UNIQUEID}.wav,b,)
 same => n,Queue(cola-ventas,tT,,,300)
 same => n,Hangup()

; --------------------------------------------------------------------------
; CONTEXTO FROM-CALL-SERVICE: punto de entrada del Originate desde ARI/AMI
; call-service inyecta variables LEAD_ID y CAMPANA_ID en el canal.
; --------------------------------------------------------------------------
[from-call-service]
; Variante 1: call-service entrega a la cola via Queue()
exten => queue,1,NoOp(Originate saliente -> cola-ventas)
 same => n,Answer()
 same => n,MixMonitor(/var/spool/asterisk/recording/${UNIQUEID}.wav,b,)
 same => n,Queue(cola-ventas,tT,,,300)
 same => n,Hangup()

; Variante 2: entrega directa a una extension especifica (debug/preview)
exten => _direct-1XXX,1,NoOp(Originate hacia ${EXTEN:7})
 same => n,Set(__LEAD_ID=${LEAD_ID})
 same => n,Set(__CAMPANA_ID=${CAMPANA_ID})
 same => n,MixMonitor(/var/spool/asterisk/recording/${UNIQUEID}.wav,b,)
 same => n,Dial(PJSIP/${EXTEN:7},30,tT)
 same => n,Hangup()

; --------------------------------------------------------------------------
; CONTEXTO STASIS (reservado para Fase 2)
; --------------------------------------------------------------------------
[stasis-default]
exten => _X.,1,NoOp(Entrando a Stasis app)
 same => n,Stasis(${STASIS_APP})
 same => n,Hangup()

; ============================================================================
; manager.conf - Asterisk Manager Interface (AMI)
; Usado por call-service para eventos de cola y acciones de control.
; ============================================================================
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = yes
allowmultiplelogin = yes
webenabled = no
timestampevents = yes

[callservice]
secret = callservice_secret
deny = 0.0.0.0/0.0.0.0
; Permite cualquier IP del bridge de Docker (red albru-network)
permit = 0.0.0.0/0.0.0.0
read = system,call,log,verbose,agent,user,config,command,dtmf,reporting,cdr,dialplan,originate
write = system,call,agent,user,config,command,reporting,originate
